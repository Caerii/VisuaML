name: v37 pinned pretrained CNN ONNX source preflight
on:
  pull_request:
    paths:
      - visuaml-client/backend/scripts/audit_pretrained_onnx_v37.py
      - visuaml-client/backend/tests/test_pretrained_onnx_preflight_v37.py
      - .github/workflows/pretrained-cnn-preflight-v37.yml
      - docs/V37_PRETRAINED_CNN_PREFLIGHT.md
  push:
    branches:
      - main
    paths:
      - visuaml-client/backend/scripts/audit_pretrained_onnx_v37.py
      - visuaml-client/backend/tests/test_pretrained_onnx_preflight_v37.py
      - .github/workflows/pretrained-cnn-preflight-v37.yml
      - docs/V37_PRETRAINED_CNN_PREFLIGHT.md
jobs:
  pinned-source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned passive ONNX parser and test dependencies
        run: python -m pip install --disable-pip-version-check onnx==1.18.0 numpy==2.2.6 pytest==8.4.2
      - name: Adversarial byte/graph audit tests
        env:
          PYTHONNOUSERSITE: "1"
        run: |
          cd visuaml-client/backend
          python -m pytest -q tests/test_pretrained_onnx_preflight_v37.py
      - name: Retrieve exact published ONNX Model Zoo checkpoint bytes
        run: |
          mkdir -p pretrained-v37
          curl --fail --location --retry 3 --max-time 75 \
            'https://huggingface.co/onnxmodelzoo/mnist-8/resolve/a19f9a8c2333de1df9b03f10f5739f468b699a1a/mnist-8.onnx' \
            --output pretrained-v37/mnist-8.onnx
          echo '2f06e72de813a8635c9bc0397ac447a601bdbfa7df4bebc278723b958831c9bf  pretrained-v37/mnist-8.onnx' | sha256sum --check --status
          test "$(wc -c < pretrained-v37/mnist-8.onnx)" -eq 26454
      - name: Passive graph preflight and durable report
        run: |
          python visuaml-client/backend/scripts/audit_pretrained_onnx_v37.py \
            --model pretrained-v37/mnist-8.onnx \
            --sha256 2f06e72de813a8635c9bc0397ac447a601bdbfa7df4bebc278723b958831c9bf \
            --revision a19f9a8c2333de1df9b03f10f5739f468b699a1a \
            --output pretrained-v37/mnist-8-preflight.json
          python - <<'PY'
          import json
          p=json.load(open('pretrained-v37/mnist-8-preflight.json'))
          assert p['status']=='preflight_only'
          assert p['executed_native'] is False
          assert p['numerical_oracle_executed'] is False
          assert p['checkpoint_sha256']=='2f06e72de813a8635c9bc0397ac447a601bdbfa7df4bebc278723b958831c9bf'
          print('Exact-byte graph inventory:',p['op_histogram'])
          PY
          printf '%s\n' "${GITHUB_SHA}" > pretrained-v37/source-commit.txt
      - name: Upload raw source-bound preflight (no numerical certification)
        uses: actions/upload-artifact@v4
        with:
          name: pinned-mnist8-static-preflight-v37
          path: |
            pretrained-v37/mnist-8-preflight.json
            pretrained-v37/source-commit.txt
          if-no-files-found: error
          retention-days: 30
