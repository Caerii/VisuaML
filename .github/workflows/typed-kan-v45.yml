name: v45 typed KAN bases, MultKAN and independent native codegen
on:
  push:
    branches:
      - research/v45-typed-kan-modules
      - main
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/typed_kan_v45.py
      - visuaml-client/backend/visuaml/compiler_lab/torch_kan_v45.py
      - visuaml-client/backend/visuaml/compiler_lab/native_kan_codegen_v45.py
      - visuaml-client/backend/tests/test_typed_kan_v45.py
      - visuaml-client/backend/scripts/probe_typed_kan_v45.py
      - docs/V45_KAN_MECHANISM_IR.md
      - .github/workflows/typed-kan-v45.yml
  pull_request:
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/typed_kan_v45.py
      - visuaml-client/backend/visuaml/compiler_lab/torch_kan_v45.py
      - visuaml-client/backend/visuaml/compiler_lab/native_kan_codegen_v45.py
      - visuaml-client/backend/tests/test_typed_kan_v45.py
      - visuaml-client/backend/scripts/probe_typed_kan_v45.py
      - docs/V45_KAN_MECHANISM_IR.md
      - .github/workflows/typed-kan-v45.yml
permissions:
  contents: read
jobs:
  kan-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Tensor, symbolic, native and tests dependencies
        run: |
          python -m pip install torch==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==2.2.6 sympy==1.14.0 pytest==8.4.2 ruff==0.17.5
      - name: Run all five KAN basis families and MultKAN adversarial tests
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m pytest -q visuaml-client/backend/tests/test_typed_kan_v45.py
          ruff check visuaml-client/backend/visuaml/compiler_lab/typed_kan_v45.py visuaml-client/backend/visuaml/compiler_lab/torch_kan_v45.py visuaml-client/backend/visuaml/compiler_lab/native_kan_codegen_v45.py visuaml-client/backend/tests/test_typed_kan_v45.py visuaml-client/backend/scripts/probe_typed_kan_v45.py
      - name: Independent numerical, native and symbolic full-graph replay
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          VISUAML_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p evidence-v45
          python visuaml-client/backend/scripts/probe_typed_kan_v45.py --output evidence-v45/typed-kan-multkan-v45.json
          python - <<'PY'
          import json
          p=json.load(open("evidence-v45/typed-kan-multkan-v45.json"))
          assert p["schema"]=="visuaml.typed-kan-multibasis-replay.v45"
          assert p["native_cpp17_executed"] is True
          assert p["all_numerical_oracles_passed"] is True
          assert len(p["cases"]) == 7
          assert p["multkan_product_demonstrated"] is True
          assert p["v43_symbolic_recovered"] is True
          assert p["kan_bases_trained_on_pretrained_checkpoint"] is False
          assert p["pretrained_interpretability_certified"] is False
          assert p["real_accuracy_or_speedup_measured"] is False
          print("Mixed KAN/MultKAN graphs executed independently",len(p["cases"]))
          PY
      - name: Retain raw KAN graph, basis, native and symbolic witness transcript
        uses: actions/upload-artifact@v4
        with:
          name: typed-kan-multibasis-v45
          path: evidence-v45/typed-kan-multkan-v45.json
          if-no-files-found: error
          retention-days: 30
