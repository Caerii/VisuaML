name: Independent native C++ Llama parity
on:
  push:
    branches:
      - main
      - feat/native-cpu-research-studio-v28
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/native_cpu_v28.cpp
      - visuaml-client/backend/visuaml/compiler_lab/native_cpu_v28.py
      - visuaml-client/backend/scripts/probe_native_llama_v28.py
      - visuaml-client/backend/examples/native_cpu_bench_v28.py
      - .github/workflows/native-cpu-v28.yml
  pull_request:
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/native_cpu_v28.cpp
      - visuaml-client/backend/visuaml/compiler_lab/native_cpu_v28.py
      - visuaml-client/backend/scripts/probe_native_llama_v28.py
      - visuaml-client/backend/examples/native_cpu_bench_v28.py
jobs:
  native-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned independent reference
        run: |
          python -m pip install torch==2.9.1+cpu torchvision==0.24.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.1.3 transformers==4.46.3 huggingface-hub==0.36.2 safetensors==0.4.5 sentencepiece==0.2.1 protobuf==5.29.5
      - name: Verify independent native C++17 backend against pretrained Llama
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DISABLE_XET: "1"
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          PYTHONPATH=visuaml-client/backend python visuaml-client/backend/scripts/probe_native_llama_v28.py
