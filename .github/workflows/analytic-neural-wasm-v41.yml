name: v41 analytic neural specialization and manifest-free function extraction
on:
  push:
    branches:
      - research/v41-analytic-neural-specialization
      - main
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/analytic_relu_specialization_v41.py
      - visuaml-client/backend/scripts/probe_analytic_neural_wasm_v41.py
      - visuaml-client/backend/tests/test_analytic_relu_specialization_v41.py
      - .github/workflows/analytic-neural-wasm-v41.yml
  pull_request:
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/analytic_relu_specialization_v41.py
      - visuaml-client/backend/scripts/probe_analytic_neural_wasm_v41.py
      - visuaml-client/backend/tests/test_analytic_relu_specialization_v41.py
      - .github/workflows/analytic-neural-wasm-v41.yml
permissions:
  contents: read
jobs:
  analytic-neural:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned NumPy, independent WebAssembly engine and package prerequisites
        run: |
          python -m pip install torch==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==2.2.6 pytest==8.4.2 wasmtime==28.0.0 ruff==0.17.5
      - name: Test analytic neural circuits, manifest-free recovery and adversarial failure modes
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m pytest -q visuaml-client/backend/tests/test_analytic_relu_specialization_v41.py visuaml-client/backend/tests/test_wasm_state_vm_v40.py visuaml-client/backend/tests/test_wasm_state_archive_v40.py
          ruff check visuaml-client/backend/visuaml/compiler_lab/analytic_relu_specialization_v41.py visuaml-client/backend/tests/test_analytic_relu_specialization_v41.py visuaml-client/backend/scripts/probe_analytic_neural_wasm_v41.py
      - name: Execute real WASM, analytic ReLU circuit, and function recovery over 256 inputs
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          mkdir -p evidence-v41
          python visuaml-client/backend/scripts/probe_analytic_neural_wasm_v41.py --output evidence-v41/neural-wasm-v41.json
          python - <<'PY'
          import json
          p=json.load(open("evidence-v41/neural-wasm-v41.json"))
          assert p["complete"] and p["real_wasm_executed"] and p["analytic_neural_weights_executed"]
          assert p["manifest_free_function_recovered"] and p["checked_inputs"] == 256
          assert p["outside_domain_counterexample"]["disagree"]
          assert p["source_program_recovered"] is False
          assert p["universal_neural_vm"] is False
          print("Exact bounded neural witnesses", p["checked_inputs"])
          PY
      - name: Upload source-bound neural circuit weights and full independent witnesses
        uses: actions/upload-artifact@v4
        with:
          name: analytic-neural-wasm-v41
          path: evidence-v41/neural-wasm-v41.json
          if-no-files-found: error
          retention-days: 30
