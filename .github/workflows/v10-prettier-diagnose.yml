name: v10 diagnose Prettier idempotence
on:
  push:
    branches: [feat/compiler-ir-backends-assembly-spike]
    paths: ['.github/workflows/v10-prettier-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: pnpm install --frozen-lockfile
      - name: Iterate formatter and inspect hashes
        run: |
          cd visuaml-client
          echo BEFORE; sha256sum server/index.ts
          pnpm exec prettier --check server/index.ts || true
          pnpm exec prettier --write server/index.ts
          echo FIRST; sha256sum server/index.ts
          pnpm exec prettier --check server/index.ts || true
          pnpm exec prettier --write server/index.ts
          echo SECOND; sha256sum server/index.ts
          pnpm exec prettier --check server/index.ts || true
          echo DIFF; git diff --stat; git diff -- server/index.ts | head -100
