name: v10 one-shot safe formatting
on:
  push:
    branches: [feat/compiler-ir-backends-assembly-spike]
    paths: ['.github/workflows/v10-format-once.yml']
permissions:
  contents: write
jobs:
  safe-format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compiler-ir-backends-assembly-spike
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install 'ruff==0.17.4'
      - run: pnpm install --frozen-lockfile
      - name: Apply safe Ruff repairs and formatting
        run: |
          ruff check --fix visuaml-client/backend || test "$?" = 1
          ruff format visuaml-client/backend
          ruff check visuaml-client/backend
      - name: Apply Prettier to touched frontend and API files
        run: |
          pnpm --dir visuaml-client exec prettier --write src/ui/CompilerLab/CompilerLabPage.tsx src/ui/CompilerLab/types.ts server/index.ts server/compilerLab.ts
          pnpm --dir visuaml-client exec prettier --check .
      - name: Verify frontend after cleanup
        run: |
          pnpm --filter visuaml-client run lint
          pnpm --filter visuaml-client run test -- --run
          pnpm --filter visuaml-client run build
      - name: Commit only mechanical fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visuaml-client
          if ! git diff --cached --quiet; then
            git commit -m "chore(compiler): apply safe Ruff and Prettier formatting to v10"
            git push origin HEAD:feat/compiler-ir-backends-assembly-spike
          fi
