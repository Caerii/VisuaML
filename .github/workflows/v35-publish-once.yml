name: Temporary v35 deterministic graph publisher and formatter

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v35-publish-once.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == 'Caerii/VisuaML'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v35-replayable-knowledge-graph
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile
      - name: Generate and check deterministic source-bound graph
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
        run: |
          python visuaml-client/backend/scripts/build_knowledge_graph_v35.py
          python visuaml-client/backend/scripts/build_knowledge_graph_v35.py --check
      - name: Apply exact repo formatter to handwritten client source
        run: |
          pnpm --dir visuaml-client exec prettier --write src/ui/ResearchEvidence/knowledgeModel.ts src/ui/ResearchEvidence/knowledgeModel.test.ts src/ui/ResearchEvidence/ResearchKnowledgePage.tsx src/App.tsx src/ui/ResearchEvidence/ResearchLibraryPage.tsx src/ui/ResearchEvidence/ResearchEvidencePage.tsx
      - name: Commit only deterministic output and formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visuaml-client/public/evidence/knowledge-v35.json visuaml-client/src/ui/ResearchEvidence/knowledgeModel.ts visuaml-client/src/ui/ResearchEvidence/knowledgeModel.test.ts visuaml-client/src/ui/ResearchEvidence/ResearchKnowledgePage.tsx visuaml-client/src/App.tsx visuaml-client/src/ui/ResearchEvidence/ResearchLibraryPage.tsx visuaml-client/src/ui/ResearchEvidence/ResearchEvidencePage.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(v35): publish exact graph and format research inspection'
            git fetch origin research/v35-replayable-knowledge-graph
            git rebase origin/research/v35-replayable-knowledge-graph
            git push origin HEAD:research/v35-replayable-knowledge-graph
          fi
