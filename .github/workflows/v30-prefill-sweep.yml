name: Native v30 prefill geometry sweep
on:
  pull_request:
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/native_cpu_v28.cpp
      - visuaml-client/backend/visuaml/compiler_lab/native_cpu_v28.py
      - visuaml-client/backend/examples/native_cpu_prefill_bench_v30.py
      - visuaml-client/backend/scripts/sweep_native_prefill_v30.py
      - visuaml-client/backend/scripts/compare_v29_v30_default.py
      - .github/workflows/v30-prefill-sweep.yml
  workflow_dispatch:
jobs:
  geometry-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU numerical dependencies
        run: |
          python -m pip install torch==2.9.1+cpu torchvision==0.24.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.1.3 transformers==4.46.3 huggingface-hub==0.36.2 safetensors==0.4.5 sentencepiece==0.2.1 protobuf==5.29.5
      - name: Verify independent native correctness and sweep bounded geometries
        env:
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          PYTHONPATH=visuaml-client/backend python visuaml-client/backend/scripts/sweep_native_prefill_v30.py --trials 5 --output v30-prefill-shape-sweep.json
      - name: Upload verified shape-specific evidence
        uses: actions/upload-artifact@v4
        with:
          name: v30-prefill-shape-sweep
          path: v30-prefill-shape-sweep.json
          if-no-files-found: error
          retention-days: 30
      - name: Paired default AVX2 v29 to v30 regression check
        env:
          PYTHONNOUSERSITE: "1"
          HF_HUB_DISABLE_XET: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python visuaml-client/backend/scripts/compare_v29_v30_default.py --pairs 2 --trials 7 --output v29-v30-default-avx2.json
      - name: Upload source-bound default-regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: v29-v30-default-avx2
          path: v29-v30-default-avx2.json
          if-no-files-found: error
          retention-days: 30
