name: v47 spatial donor patching and causal KAN prediction
on:
  push:
    branches: [research/v47-spatial-causal-patching, main]
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/spatial_activation_patching_v47.py
      - visuaml-client/backend/tests/test_spatial_activation_patching_v47.py
      - visuaml-client/backend/scripts/probe_spatial_causal_kan_v47.py
      - visuaml-client/backend/scripts/probe_spatial_causal_kan_v47.py
      - visuaml-client/backend/tests/test_spatial_causal_kan_archive_v47.py
      - .github/workflows/spatial-causal-kan-v47.yml
  pull_request:
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/spatial_activation_patching_v47.py
      - visuaml-client/backend/tests/test_spatial_activation_patching_v47.py
      - visuaml-client/backend/scripts/probe_spatial_causal_kan_v47.py
      - visuaml-client/backend/tests/test_spatial_causal_kan_archive_v47.py
      - .github/workflows/spatial-causal-kan-v47.yml
permissions:
  contents: write
jobs:
  donor-patching:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source-bound independent ONNX and numerical tooling
        run: |
          python -m pip install torch==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check onnx==1.18.0 onnxruntime==1.22.1 numpy==2.2.6 pytest==8.4.2 ruff==0.17.5
      - name: Fetch original checkpoint by immutable upstream revision and SHA
        run: |
          mkdir -p evidence-v47
          curl --fail --location --retry 3 --max-time 75 'https://huggingface.co/onnxmodelzoo/mnist-8/resolve/a19f9a8c2333de1df9b03f10f5739f468b699a1a/mnist-8.onnx' --output evidence-v47/mnist-8.onnx
          echo '2f06e72de813a8635c9bc0397ac447a601bdbfa7df4bebc278723b958831c9bf  evidence-v47/mnist-8.onnx' | sha256sum --check
          test "$(wc -c < evidence-v47/mnist-8.onnx)" -eq 26454
      - name: Verify original CNN donor patch against independent scalar downstream oracle
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          VISUAML_PINNED_MODEL: evidence-v47/mnist-8.onnx
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m pytest -q visuaml-client/backend/tests/test_spatial_activation_patching_v47.py
          ruff check visuaml-client/backend/visuaml/compiler_lab/spatial_activation_patching_v47.py visuaml-client/backend/tests/test_spatial_activation_patching_v47.py visuaml-client/backend/scripts/probe_spatial_causal_kan_v47.py

      - name: Measure causal effects and whether fitted KAN patches predict them
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          VISUAML_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python visuaml-client/backend/scripts/probe_spatial_causal_kan_v47.py --model evidence-v47/mnist-8.onnx --output evidence-v47/spatial-causal-kan.json
          python - <<'PY'
          import json
          r=json.load(open("evidence-v47/spatial-causal-kan.json"))
          assert r["schema"]=="visuaml.pretrained-spatial-causal-kan.v47"
          assert r["original_checkpoint_sha256"]=="2f06e72de813a8635c9bc0397ac447a601bdbfa7df4bebc278723b958831c9bf"
          assert r["original_v46_preselected_channel"] == 5
          assert r["selected_from_discovery_only"]
          assert len(r["region_discovery_scores"]) == 5
          assert len(r["fitted_basis_families"]) == 5
          assert len(r["same_image_causal_witnesses"]) == 16
          assert len(r["cross_image_causal_witnesses"]) == 16
          assert len(r["independent_scalar_oracles"]) == 2
          assert all(x["logit_oracle"]["passed"] for x in r["independent_scalar_oracles"])
          assert not r["pretrained_kan_internal_mechanism_certified"]
          assert not r["cross_checkpoint_transfer_proved"]
          assert not r["other_image_is_representative_of_natural_images"]
          print("actual KAN donor causal prediction MAE",r["mean_kan_causal_prediction_mae_same"],r["mean_kan_causal_prediction_mae_cross"])
          PY
      - name: Upload full source-bound causal donor and KAN counterexample record
        uses: actions/upload-artifact@v4
        with:
          name: spatial-causal-kan-v47
          path: evidence-v47/spatial-causal-kan.json
          if-no-files-found: error
          retention-days: 30
      - name: Archive first original causal donor experiment on trusted push
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_NAME" != "research/v47-spatial-causal-patching" ]; then
            echo "Untrusted or unrelated event, archive unchanged."
            exit 0
          fi
          if [ -e benchmarks/spatial_causal_kan_v47.json ] || [ -e benchmarks/spatial_causal_kan_v47.origin.json ]; then
            test -f benchmarks/spatial_causal_kan_v47.json
            test -f benchmarks/spatial_causal_kan_v47.origin.json
            echo "Historical original archive exists; never overwrite."
            exit 0
          fi
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          raw = Path("evidence-v47/spatial-causal-kan.json").read_bytes()
          r=json.loads(raw)
          assert r["source_commit"]==os.environ["GITHUB_SHA"]
          assert r["original_checkpoint_sha256"]=="2f06e72de813a8635c9bc0397ac447a601bdbfa7df4bebc278723b958831c9bf"
          assert r["selected_from_discovery_only"] and r["original_v46_preselected_channel"]==5
          assert len(r["independent_scalar_oracles"])==2
          assert all(x["logit_oracle"]["passed"] for x in r["independent_scalar_oracles"])
          assert not r["pretrained_kan_internal_mechanism_certified"]
          dest=Path("benchmarks")
          dest.mkdir(exist_ok=True)
          (dest/"spatial_causal_kan_v47.json").write_bytes(raw)
          manifest={
              "schema":"visuaml.spatial-causal-kan-origin.v47",
              "source_commit":os.environ["GITHUB_SHA"],
              "run_url":"https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],
              "raw_sha256":hashlib.sha256(raw).hexdigest(),
              "raw_bytes":len(raw),
              "source_file_sha256":r["source_file_sha256"],
              "source_checkpoint_sha256":r["original_checkpoint_sha256"],
              "patched_model_sha256":r["patchable_model_sha256"],
              "selected_region":r["selected_region"],
              "kan_curve_proven_internal_mechanism":False,
              "cross_checkpoint_transfer_proved":False,
              "signed_external_attestation":False,
          }
          (dest/"spatial_causal_kan_v47.origin.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True,allow_nan=False)+"\n",
              encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/spatial_causal_kan_v47.json benchmarks/spatial_causal_kan_v47.origin.json
          git commit -m "v47: archive independently verified donor causal/KAN predictions [skip ci]"
          git push origin "HEAD:refs/heads/research/v47-spatial-causal-patching"
