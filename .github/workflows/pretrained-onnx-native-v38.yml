name: v38 pretrained ONNX through shared Semantic IR native C++
on:
  push:
    branches:
      - research/v38-onnx-semantic-native
      - main
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/native_semantic_codegen_v32.py
      - visuaml-client/backend/visuaml/compiler_lab/onnx_semantic_frontend_v38.py
      - visuaml-client/backend/visuaml/compiler_lab/semantic_ir.py
      - visuaml-client/backend/scripts/probe_pretrained_mnist8_native_v38.py
      - visuaml-client/backend/tests/test_onnx_semantic_native_v38.py
      - .github/workflows/pretrained-onnx-native-v38.yml
  pull_request:
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/native_semantic_codegen_v32.py
      - visuaml-client/backend/visuaml/compiler_lab/onnx_semantic_frontend_v38.py
      - visuaml-client/backend/visuaml/compiler_lab/semantic_ir.py
      - visuaml-client/backend/scripts/probe_pretrained_mnist8_native_v38.py
      - visuaml-client/backend/tests/test_onnx_semantic_native_v38.py
      - .github/workflows/pretrained-onnx-native-v38.yml
permissions:
  contents: read
jobs:
  generated-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned native, ONNX and numerical dependencies
        run: |
          python -m pip install torch==2.9.1+cpu torchvision==0.24.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r visuaml-client/backend/requirements.txt
          python -m pip install onnx==1.18.0 onnxruntime==1.22.1 numpy==2.2.6 pytest==8.4.2 ruff==0.17.5
      - name: Graph admission and native codegen regression
        env:
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          cd visuaml-client
          python -m pytest -q backend/tests/test_onnx_semantic_native_v38.py backend/tests/test_native_semantic_codegen_v32.py backend/tests/test_native_fx_frontend_v32.py
          ruff check backend/visuaml/compiler_lab/native_semantic_codegen_v32.py backend/visuaml/compiler_lab/onnx_semantic_frontend_v38.py backend/scripts/probe_pretrained_mnist8_native_v38.py backend/tests/test_onnx_semantic_native_v38.py
      - name: Fetch immutable pretrained MNIST-8 checkpoint
        run: |
          mkdir -p pretrained-v38
          curl --fail --location --retry 3 --max-time 75 'https://huggingface.co/onnxmodelzoo/mnist-8/resolve/a19f9a8c2333de1df9b03f10f5739f468b699a1a/mnist-8.onnx' --output pretrained-v38/mnist-8.onnx
          echo '2f06e72de813a8635c9bc0397ac447a601bdbfa7df4bebc278723b958831c9bf  pretrained-v38/mnist-8.onnx' | sha256sum --check
          test "$(wc -c < pretrained-v38/mnist-8.onnx)" -eq 26454
      - name: Execute all 12 pretrained nodes as graph-generated C++ and compare independent oracles
        env:
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          PYTHONPATH: visuaml-client/backend
          VISUAML_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python visuaml-client/backend/scripts/probe_pretrained_mnist8_native_v38.py --model pretrained-v38/mnist-8.onnx --output pretrained-v38/mnist-8-native-replay.json
          python - <<'PY'
          import json
          d=json.load(open("pretrained-v38/mnist-8-native-replay.json"))
          assert d["schema"]=="visuaml.pretrained-onnx-native-semantic.v38"
          assert d["native_execution"] is True and d["all_passed"] is True
          assert d["graph_operation_count"] == 12 and len(d["witnesses"]) == 5
          print("Native source:", d["compiler"]["generated_cpp_sha256"])
          print("Native binary:", d["compiler"]["native_binary_sha256"])
          PY
      - name: Upload complete verified native source, receipts and raw numerical witnesses
        uses: actions/upload-artifact@v4
        with:
          name: pretrained-mnist8-semantic-native-v38
          path: pretrained-v38/mnist-8-native-replay.json
          if-no-files-found: error
          retention-days: 30

  archive-verified-result:
    needs: generated-native
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/v38-onnx-semantic-native'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v38-onnx-semantic-native
          persist-credentials: true
      - name: Require the original source commit, not a newer moving branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: pretrained-mnist8-semantic-native-v38
          path: recovered-native-v38
      - name: Append-only archival of exact original JSON and separate origin manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          raw = Path("recovered-native-v38/mnist-8-native-replay.json").read_bytes()
          record = json.loads(raw)
          sha = hashlib.sha256(raw).hexdigest()
          assert record["source_commit"] == os.environ["GITHUB_SHA"]
          assert record["native_execution"] is True and record["all_passed"] is True
          assert record["graph_operation_count"] == 12 and len(record["witnesses"]) == 5
          assert record["checkpoint_sha256"] == "2f06e72de813a8635c9bc0397ac447a601bdbfa7df4bebc278723b958831c9bf"
          assert hashlib.sha256(record["generated_cpp"].encode()).hexdigest() == record["compiler"]["generated_cpp_sha256"]
          assert all(all(y["passed"] for y in w["numerics"].values()) and w["input_immutability"] for w in record["witnesses"])
          root = Path("benchmarks")
          evidence = root / "pretrained_mnist8_native_semantic_v38.json"
          origin = root / "pretrained_mnist8_native_semantic_v38.origin.json"
          if evidence.exists() or origin.exists():
              raise SystemExit("Refuse to replace existing source-bound numerical archive")
          evidence.write_bytes(raw)
          ledger = {
              "schema": "visuaml.pretrained-native-archive-origin.v38",
              "evidence_path": evidence.as_posix(),
              "evidence_sha256": sha,
              "evidence_bytes": len(raw),
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run_url": (
                  "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
                  + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
              ),
              "checkpoint_sha256": record["checkpoint_sha256"],
              "semantic_sha256": record["compiler"]["semantic_sha256"],
              "generated_cpp_sha256": record["compiler"]["generated_cpp_sha256"],
              "native_binary_sha256": record["compiler"]["native_binary_sha256"],
              "verification_scope": "Finite five-case, source-bound, graph-derived native pretrained CNN against ONNX Runtime and independent scalar NumPy. Not all-input equivalence.",
          }
          origin.write_text(json.dumps(ledger, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print("Permanent source-bound archive bytes:", len(raw), "SHA-256:", sha)
          PY
          git config user.name 'visuaml-evidence-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/pretrained_mnist8_native_semantic_v38.json benchmarks/pretrained_mnist8_native_semantic_v38.origin.json
          git diff --cached --exit-code --quiet && exit 0
          git commit -m 'v38: archive exact successful native pretrained experiment and CI origin'
          git push origin HEAD:research/v38-onnx-semantic-native
