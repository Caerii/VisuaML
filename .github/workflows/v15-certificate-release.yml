name: v15 source-bound certificate regeneration (one shot)
on:
  push:
    branches: [feat/compiler-ir-backends-assembly-spike]
    paths: ['.github/workflows/v15-certificate-release.yml']
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'Caerii/VisuaML'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compiler-ir-backends-assembly-spike
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU numeric environment
        run: |
          python -m pip install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.1.3' 'pytest==8.3.4'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Rebuild v13/v14 numerical certificates from committed code
        working-directory: visuaml-client
        env:
          PYTHONPATH: backend
        run: |
          python backend/scripts/generate_decoder_certificate_v13.py
          python backend/scripts/generate_stacked_certificate_v14.py --output public/stacked_decoder_certificate.v14.json
      - name: Format certificates with repository Prettier rules
        run: |
          pnpm --dir visuaml-client exec prettier --write public/decoder_compiler_certificate.v13.json public/stacked_decoder_certificate.v14.json
      - name: Check updated evidence against committed Python semantics
        working-directory: visuaml-client
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q backend/tests/test_decoder_certification_v13.py backend/tests/test_stacked_certification_v14.py
      - name: Commit regenerated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visuaml-client/public/decoder_compiler_certificate.v13.json visuaml-client/public/stacked_decoder_certificate.v14.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(cert): regenerate Python 3.12 evidence for v15 runtime"
            git push origin HEAD:feat/compiler-ir-backends-assembly-spike
          fi
