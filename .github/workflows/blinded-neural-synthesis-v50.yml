name: v50 blinded neural behavioral synthesis and all-i32 SMT
on:
  push:
    branches:
      - research/v50-blinded-neural-behavior-synthesis
      - main
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/blinded_behavioral_synthesis_v50.py
      - visuaml-client/backend/scripts/probe_blinded_neural_synthesis_v50.py
      - visuaml-client/backend/tests/test_blinded_behavioral_synthesis_v50.py
      - .github/workflows/blinded-neural-synthesis-v50.yml
  pull_request:
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/blinded_behavioral_synthesis_v50.py
      - visuaml-client/backend/scripts/probe_blinded_neural_synthesis_v50.py
      - visuaml-client/backend/tests/test_blinded_behavioral_synthesis_v50.py
      - .github/workflows/blinded-neural-synthesis-v50.yml
permissions:
  contents: read
jobs:
  bounded-decompilation:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned independent Z3, Wasmtime and numerical dependencies
        run: |
          python -m pip install torch==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==2.2.6 pytest==8.4.2 wasmtime==28.0.0 z3-solver==4.13.4.0 ruff==0.17.5
      - name: Verify blinded neural symbolic program inference and adversarial limits
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m pytest -q visuaml-client/backend/tests/test_blinded_behavioral_synthesis_v50.py
          python -m pytest -q visuaml-client/backend/tests/test_bit_neural_archive_v49.py
          ruff check visuaml-client/backend/visuaml/compiler_lab/blinded_behavioral_synthesis_v50.py visuaml-client/backend/tests/test_blinded_behavioral_synthesis_v50.py visuaml-client/backend/scripts/probe_blinded_neural_synthesis_v50.py
      - name: Synthesize five blinded neural behaviors and prove source-vs-symbolic i32 equivalence
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          VISUAML_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p evidence-v50
          python visuaml-client/backend/scripts/probe_blinded_neural_synthesis_v50.py --output evidence-v50/blinded-neural-cegis.json
          python - <<'PY'
          import json
          r=json.load(open("evidence-v50/blinded-neural-cegis.json"))
          assert r["schema"]=="visuaml.blinded-neural-behavior-evidence.v50"
          assert r["program_count"]==5 and r["heldout_values_per_program"]==16
          assert r["all_i32_source_candidate_smt_checked"]
          assert r["true_source_wasm_compiled_by_wasmtime"]
          assert r["multiple_source_programs_same_behavior_possible"]
          assert r["cubic_outside_grammar_rejected"]
          assert all(all(x["pass"] for x in p["heldout_witnesses"]) for p in r["results"])
          assert all(p["synthesis_report"]["all_i32_source_vs_candidate_equivalent"] for p in r["results"])
          assert all(p["synthesis_report"]["rounds"][-1]["verification"]["solver_outcome"]=="unsat" for p in r["results"])
          assert not r["unique_historical_program_recovery_claimed"]
          assert not r["arbitrary_neural_model_decompilation_claimed"]
          assert not r["neural_gate_all_i32_equivalence_proved"]
          print("All five reviewed neural behaviors synthesized with external all-i32 SMT certificates")
          PY
      - name: Retain raw semantic hypotheses, WASM binaries and source-bound SMT receipts
        uses: actions/upload-artifact@v4
        with:
          name: blinded-neural-cegis-v50
          path: evidence-v50/blinded-neural-cegis.json
          if-no-files-found: error
          retention-days: 30
