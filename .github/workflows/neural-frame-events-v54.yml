name: v54 neural frame event gate truth-table validation
on:
  push:
    branches:
      - research/v54-neural-frame-event-decoder
      - main
    paths:
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_frame_events_v54.py'
      - 'visuaml-client/backend/tests/test_neural_frame_events_v54.py'
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_event_executor_v54.py'
      - 'visuaml-client/backend/tests/test_neural_event_executor_v54.py'
      - '.github/workflows/neural-frame-events-v54.yml'
  pull_request:
    paths:
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_frame_events_v54.py'
      - 'visuaml-client/backend/tests/test_neural_frame_events_v54.py'
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_event_executor_v54.py'
      - 'visuaml-client/backend/tests/test_neural_event_executor_v54.py'
      - '.github/workflows/neural-frame-events-v54.yml'
jobs:
  event-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install standard backend dependencies
        run: |
          python -m pip install torch==2.9.1+cpu torchvision==0.24.1+cpu torchaudio==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r visuaml-client/backend/requirements.txt
          python -m pip install pytest ruff 'wasmtime>=20,<50'
      - name: Exhaustively validate event gates and negative controls
        run: |
          ruff check visuaml-client/backend/visuaml/compiler_lab/neural_frame_events_v54.py visuaml-client/backend/tests/test_neural_frame_events_v54.py visuaml-client/backend/visuaml/compiler_lab/neural_event_executor_v54.py visuaml-client/backend/tests/test_neural_event_executor_v54.py
          PYTHONPATH=visuaml-client/backend python -m pytest -q visuaml-client/backend/tests/test_neural_frame_events_v54.py visuaml-client/backend/tests/test_neural_event_executor_v54.py
