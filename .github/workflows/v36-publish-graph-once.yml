name: Temporary v36 replay knowledge graph publisher

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v36-publish-graph-once.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == 'Caerii/VisuaML'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v36-pretrained-replay-witness
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate exact v36 graph from archived independent numerical evidence
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
        run: |
          python visuaml-client/backend/scripts/archive_pretrained_replay_v36.py --check
          python visuaml-client/backend/scripts/build_replay_graph_v36.py
          python visuaml-client/backend/scripts/build_replay_graph_v36.py --check
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile
      - name: Apply exact project formatter to handwritten research UI
        run: |
          pnpm --dir visuaml-client exec prettier --write src/ui/ResearchEvidence/knowledgeModel.ts src/ui/ResearchEvidence/knowledgeModel.test.ts src/ui/ResearchEvidence/ResearchKnowledgePage.tsx
      - name: Check in reproducible output without reformatting source-bound JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visuaml-client/public/evidence/knowledge-v36.json visuaml-client/src/ui/ResearchEvidence/knowledgeModel.ts visuaml-client/src/ui/ResearchEvidence/knowledgeModel.test.ts visuaml-client/src/ui/ResearchEvidence/ResearchKnowledgePage.tsx
          if ! git diff --cached --quiet; then
            git commit -m "evidence(v36): publish source-bound pretrained replay knowledge graph"
            git fetch origin research/v36-pretrained-replay-witness
            git rebase origin/research/v36-pretrained-replay-witness
            git push origin HEAD:research/v36-pretrained-replay-witness
          fi
