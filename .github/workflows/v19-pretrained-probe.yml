name: v19 pretrained TinyStories Llama parity probe
on:
  push:
    branches:
      - feat/compiler-ir-backends-assembly-spike
    paths:
      - visuaml-client/backend/scripts/probe_real_llama_v19.py
      - visuaml-client/backend/visuaml/compiler_lab/llama_semantic_v20.py
      - visuaml-client/backend/visuaml/compiler_lab/torchscript_primitives_v19.py
      - visuaml-client/backend/visuaml/compiler_lab/fused_ffn_v20.py
      - visuaml-client/backend/examples/llama_semantic_bench_v20.py
      - .github/workflows/v19-pretrained-probe.yml
jobs:
  pretrained-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed CPU reference runtime
        run: |
          python -m pip install torch==2.9.1+cpu torchvision==0.24.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.1.3 transformers==4.46.3 huggingface-hub==0.36.2 safetensors==0.4.5
      - name: Compare imported pretrained checkpoint logits against Hugging Face
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DISABLE_XET: "1"
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          PYTHONPATH=visuaml-client/backend python visuaml-client/backend/scripts/probe_real_llama_v19.py
