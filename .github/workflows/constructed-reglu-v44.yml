name: v44 exact two-ReGLU constructive synthesis
on:
  push:
    branches:
      - research/v44-constructed-reglu-circuits
      - main
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/constructed_reglu_quadratic_v44.py
      - visuaml-client/backend/tests/test_constructed_reglu_quadratic_v44.py
      - visuaml-client/backend/scripts/probe_constructed_reglu_v44.py
      - docs/V44_GATED_CONSTRUCTIVE_COMPILATION.md
      - .github/workflows/constructed-reglu-v44.yml
  pull_request:
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/constructed_reglu_quadratic_v44.py
      - visuaml-client/backend/tests/test_constructed_reglu_quadratic_v44.py
      - visuaml-client/backend/scripts/probe_constructed_reglu_v44.py
      - docs/V44_GATED_CONSTRUCTIVE_COMPILATION.md
      - .github/workflows/constructed-reglu-v44.yml
permissions:
  contents: write
jobs:
  gated-constructive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned source provenance, numerical, SMT and WASM dependencies
        run: |
          python -m pip install torch==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==2.2.6 pytest==8.4.2 wasmtime==28.0.0 z3-solver==4.13.4.0 ruff==0.17.5
      - name: Test synthesis/manifest-free inverse, exact-real SMT sign cases and guards
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m pytest -q visuaml-client/backend/tests/test_constructed_reglu_quadratic_v44.py visuaml-client/backend/tests/test_neural_symbolic_archive_v43.py visuaml-client/backend/tests/test_neural_symbolic_recovery_v43.py
          ruff check visuaml-client/backend/visuaml/compiler_lab/constructed_reglu_quadratic_v44.py visuaml-client/backend/tests/test_constructed_reglu_quadratic_v44.py visuaml-client/backend/scripts/probe_constructed_reglu_v44.py
      - name: Validate archived v41 weights through v43 symbol to independent v44 ReGLU circuit
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          VISUAML_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p evidence-v44
          python visuaml-client/backend/scripts/probe_constructed_reglu_v44.py --output evidence-v44/constructed-gated-v44.json
          python - <<'PY'
          import json
          data=json.load(open("evidence-v44/constructed-gated-v44.json"))
          assert data["schema"]=="visuaml.constructive-gated-resynthesis.v44"
          assert data["original_ordinary_relu_units"] == 255
          assert data["new_gated_reglu_units"] == 2
          assert data["original_scalar_parameter_count"] == 766
          assert data["new_scalar_parameter_count"] == 10
          assert data["estimated_speedup"] is None and not data["actual_speedup_benchmarked"]
          assert data["real_algebraic_identity_smt"]["nonnegative_domain_solver"] == "unsat"
          assert data["real_algebraic_identity_smt"]["negative_domain_solver"] == "unsat"
          assert data["real_algebraic_identity_smt"]["negative_control"] == "sat"
          assert data["source_vs_recovered_symbolic_all_i32_smt"]["solver_outcome"] == "unsat"
          assert len(data["witnesses"]) == 263 and all(x["pass"] for x in data["witnesses"])
          assert data["old_neural_extrapolation_counterexample"]["v41_and_v44_differ"]
          assert not data["constructed_network_all_i32_proved"]
          print("Two ReGLU gates rebuilt exact quadratic; 263 independent WASM witnesses")
          PY
      - name: Retain complete gated-network weights, counterexamples and proof witnesses
        uses: actions/upload-artifact@v4
        with:
          name: constructed-reglu-quadratic-v44
          path: evidence-v44/constructed-gated-v44.json
          if-no-files-found: error
          retention-days: 30

      - name: Archive original successful ReGLU construction evidence on trusted branch only
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_NAME" != "research/v44-constructed-reglu-circuits" ]; then
            echo "No archival writes for pull requests or unrelated branches."
            exit 0
          fi
          if [ -e benchmarks/constructed_reglu_v44.json ] || [ -e benchmarks/constructed_reglu_v44.origin.json ]; then
            test -f benchmarks/constructed_reglu_v44.json
            test -f benchmarks/constructed_reglu_v44.origin.json
            echo "Immutable original v44 archive already exists."
            exit 0
          fi
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          raw=Path("evidence-v44/constructed-gated-v44.json").read_bytes()
          p=json.loads(raw)
          assert p["schema"]=="visuaml.constructive-gated-resynthesis.v44"
          assert p["source_commit"]==os.environ["GITHUB_SHA"]
          assert p["original_ordinary_relu_units"]==255 and p["new_gated_reglu_units"]==2
          assert not p["actual_speedup_benchmarked"] and p["estimated_speedup"] is None
          assert not p["constructed_network_all_i32_proved"]
          assert p["real_algebraic_identity_smt"]["nonnegative_domain_solver"]=="unsat"
          assert p["real_algebraic_identity_smt"]["negative_domain_solver"]=="unsat"
          assert p["source_vs_recovered_symbolic_all_i32_smt"]["solver_outcome"]=="unsat"
          assert len(p["witnesses"])==263 and all(w["pass"] for w in p["witnesses"])
          assert p["old_neural_extrapolation_counterexample"]["v41_and_v44_differ"]
          out=Path("benchmarks/constructed_reglu_v44.json")
          origin=Path("benchmarks/constructed_reglu_v44.origin.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(raw)
          meta={
            "schema":"visuaml.reglu-origin.v44",
            "source_commit":os.environ["GITHUB_SHA"],
            "workflow_run_url":"https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],
            "raw_bytes":len(raw),
            "raw_sha256":hashlib.sha256(raw).hexdigest(),
            "source_file_sha256":p["source_file_sha256"],
            "original_v41_weights_archive_sha256":p["original_v41_weights_archive_sha256"],
            "original_v41_wasm_sha256":p["original_v41_wasm_sha256"],
            "constructed_gated_weights_sha256":p["gated_network_bundle_fingerprint"],
            "algebraic_real_cases":["unsat","unsat"],
            "distinct_gating_operation":True,
            "speedup_measured":False,
            "all_i32_neural_equivalence_proved":False,
            "authentication":"GitHub Actions CI-origin metadata and hashes; not signed external proof",
          }
          origin.write_text(json.dumps(meta,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/constructed_reglu_v44.json benchmarks/constructed_reglu_v44.origin.json
          git commit -m "v44: preserve exact gated construction and independent proofs [skip ci]"
          git push origin "HEAD:refs/heads/research/v44-constructed-reglu-circuits"
