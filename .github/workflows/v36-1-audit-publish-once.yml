name: Temporary v36.1 original full-tree audit publisher
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v36-1-audit-publish-once.yml

permissions:
  contents: write
  actions: read

jobs:
  archive:
    if: github.event.pull_request.head.repo.full_name == 'Caerii/VisuaML'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v36-full-tree-source-audit
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download completed exhaustive Git-tree investigation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/source-tree-audit
          gh run download 44196790520 --repo Caerii/VisuaML --name exhaustive-v36-source-tree-audit --dir /tmp/source-tree-audit
      - name: Preserve exact audit bytes and its original CI provenance
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          source = Path('/tmp/source-tree-audit/v36-exhaustive-source-audit.json')
          raw = source.read_bytes()
          obj = json.loads(raw)
          assert obj['schema'] == 'visuaml.exhaustive-source-tree-audit.v36.1'
          assert obj['scan_exhaustive_for_reachable_refs'] is True
          assert obj['original_ci_commit_established'] is False
          assert obj['matching_tree_count'] == 6
          assert obj['reachable_git_commits_scanned'] == 620
          assert len(obj['exact_matching_tree_commits']) == obj['matching_tree_count']
          p = Path('benchmarks/pretrained_llama_source_tree_audit_v36_1.json')
          p.write_bytes(raw)
          origin = {
              'schema': 'visuaml.source-tree-audit-origin.v36.1',
              'source_path': str(p),
              'audit_source_bytes_sha256': hashlib.sha256(raw).hexdigest(),
              'producing_ci_run': 'https://github.com/Caerii/VisuaML/actions/runs/44196790520',
              'original_ci_commit_established': False,
              'status': 'corrected_source_provenance_not_signed',
              'supersedes_claim': 'v36 no single Git commit contains the three exact source blobs',
              'limitations': 'Full reachable Git trees prove source coexistence; they do not establish which commit the original CI ran.',
          }
          Path('benchmarks/pretrained_llama_source_tree_audit_v36_1.origin.json').write_text(
              json.dumps(origin, sort_keys=True, indent=2) + '\n'
          )
          print(origin['audit_source_bytes_sha256'])
          PY
      - name: Commit additive provenance correction, never rewrite v36 archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/pretrained_llama_source_tree_audit_v36_1.json benchmarks/pretrained_llama_source_tree_audit_v36_1.origin.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(v36.1): archive exhaustive Git-tree correction"
            git fetch origin research/v36-full-tree-source-audit
            git rebase origin/research/v36-full-tree-source-audit
            git push origin HEAD:research/v36-full-tree-source-audit
          fi
