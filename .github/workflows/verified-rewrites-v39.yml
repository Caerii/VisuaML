name: v39 verified WASM layout and neural weight rewrite
on:
  push:
    branches:
      - research/v39-verified-representation-rewrites
      - main
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/wasm_bitstream_v39.py
      - visuaml-client/backend/visuaml/compiler_lab/reversible_weight_layout_v39.py
      - visuaml-client/backend/tests/test_verified_representation_rewrites_v39.py
      - .github/workflows/verified-rewrites-v39.yml
  pull_request:
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/wasm_bitstream_v39.py
      - visuaml-client/backend/visuaml/compiler_lab/reversible_weight_layout_v39.py
      - visuaml-client/backend/tests/test_verified_representation_rewrites_v39.py
      - .github/workflows/verified-rewrites-v39.yml
permissions:
  contents: read
jobs:
  verified-representation-rewrites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned independent WASM engine, NumPy and tests
        run: |
          python -m pip install torch==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 pytest==8.4.2 wasmtime==28.0.0 ruff==0.17.5
      - name: Adversarial raw-byte checks, exact algebra and independent Wasmtime execution
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m pytest -q visuaml-client/backend/tests/test_verified_representation_rewrites_v39.py
          ruff check visuaml-client/backend/visuaml/compiler_lab/wasm_bitstream_v39.py visuaml-client/backend/visuaml/compiler_lab/reversible_weight_layout_v39.py visuaml-client/backend/tests/test_verified_representation_rewrites_v39.py
