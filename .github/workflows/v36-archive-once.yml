name: Temporary v36 exact fresh replay archival publisher

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v36-archive-once.yml

permissions:
  contents: write
  actions: read

jobs:
  archive:
    if: github.event.pull_request.head.repo.full_name == 'Caerii/VisuaML'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v36-pretrained-replay-witness
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve independently executed source-bound numerical result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/v36-fresh
          gh run download 44193012326 --repo Caerii/VisuaML --name v36-independent-pretrained-numerical-replay --dir /tmp/v36-fresh
      - name: Admit original JSON and preserve an immutable origin manifest
        run: |
          python visuaml-client/backend/scripts/archive_pretrained_replay_v36.py --input /tmp/v36-fresh/replay-v36.json
          python visuaml-client/backend/scripts/archive_pretrained_replay_v36.py --check
      - name: Commit original CI bytes without rewriting measurements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/pretrained_llama_independent_replay_v36.json benchmarks/pretrained_llama_independent_replay_v36.origin.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(v36): preserve fresh independent pretrained C++ replay receipt"
            git fetch origin research/v36-pretrained-replay-witness
            git rebase origin/research/v36-pretrained-replay-witness
            git push origin HEAD:research/v36-pretrained-replay-witness
          fi
