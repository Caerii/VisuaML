name: Temporary corrected research-page formatter
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v36-1-format-once.yml
permissions:
  contents: write
jobs:
  prettier:
    if: github.event.pull_request.head.repo.full_name == 'Caerii/VisuaML'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v36-full-tree-source-audit
          persist-credentials: true
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile
      - name: Apply pinned repo Prettier to the corrected research page
        run: |
          pnpm --dir visuaml-client exec prettier --write src/ui/ResearchEvidence/ResearchKnowledgePage.tsx
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visuaml-client/src/ui/ResearchEvidence/ResearchKnowledgePage.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(v36.1): format corrected provenance inspector'
            git fetch origin research/v36-full-tree-source-audit
            git rebase origin/research/v36-full-tree-source-audit
            git push origin HEAD:research/v36-full-tree-source-audit
          fi
