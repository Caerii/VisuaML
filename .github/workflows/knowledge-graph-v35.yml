name: Historical knowledge graph and replay admission v35

on:
  push:
    branches:
      - main
    paths:
      - visuaml-client/backend/visuaml_evidence/**
      - visuaml-client/backend/tests/test_knowledge_graph_v35.py
      - visuaml-client/backend/scripts/build_knowledge_graph_v35.py
      - benchmarks/pretrained_llama_native_cpu_benchmark_v28.json
      - visuaml-client/public/evidence/knowledge-v35.json
      - .github/workflows/knowledge-graph-v35.yml
  pull_request:
    paths:
      - visuaml-client/backend/visuaml_evidence/**
      - visuaml-client/backend/tests/test_knowledge_graph_v35.py
      - visuaml-client/backend/scripts/build_knowledge_graph_v35.py
      - benchmarks/pretrained_llama_native_cpu_benchmark_v28.json
      - visuaml-client/public/evidence/knowledge-v35.json
      - .github/workflows/knowledge-graph-v35.yml

jobs:
  knowledge-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency-free provenance test tools
        run: python -m pip install pytest ruff
      - name: Validate Python style and explicit source constraints
        run: |
          ruff check visuaml-client/backend/visuaml_evidence visuaml-client/backend/tests/test_knowledge_graph_v35.py visuaml-client/backend/scripts/build_knowledge_graph_v35.py
      - name: Verify historical evidence graph, adversarial cases and stable IDs
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
        run: |
          python -m pytest -q visuaml-client/backend/tests/test_knowledge_graph_v35.py
      - name: Generate source-bound v35 graph and assert real model provenance
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
        run: |
          python visuaml-client/backend/scripts/build_knowledge_graph_v35.py --output /tmp/knowledge-v35.json
          python -c "import json; d=json.load(open('/tmp/knowledge-v35.json')); assert d['schema']=='visuaml.knowledge-graph.v35' and d['counts']['studies']==13 and d['counts']['source_artifacts']==4 and d['counts']['pinned_pretrained_witnesses']==1"
      - name: Preserve blocked replay diagnostic (no model download)
        env:
          PYTHONPATH: visuaml-client/backend
        run: |
          python visuaml-client/backend/scripts/build_knowledge_graph_v35.py --preflight > /tmp/replay-preflight-v35.json
          python -c "import json; d=json.load(open('/tmp/replay-preflight-v35.json')); assert not d['numerical_replay_performed'] and not d['static_source_and_checkpoint_ready'] and d['blockers']"
      - name: Check committed derived catalog exactly matches source bytes
        if: hashFiles('visuaml-client/public/evidence/knowledge-v35.json') != ''
        env:
          PYTHONPATH: visuaml-client/backend
        run: |
          python visuaml-client/backend/scripts/build_knowledge_graph_v35.py --check
      - name: Upload v35 graph and replay-admission evidence
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-graph-v35
          path: |
            /tmp/knowledge-v35.json
            /tmp/replay-preflight-v35.json
          if-no-files-found: error
          retention-days: 30
