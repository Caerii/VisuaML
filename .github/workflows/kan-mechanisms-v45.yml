name: v45 typed KAN and MultKAN mechanism validation
on:
  push:
    branches:
      - research/v45-kan-mechanism-ir
      - main
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/kan_mechanism_ir_v45.py
      - visuaml-client/backend/visuaml/compiler_lab/kan_symbolic_frontend_v45.py
      - visuaml-client/backend/scripts/probe_kan_mechanisms_v45.py
      - visuaml-client/backend/tests/test_kan_mechanism_ir_v45.py
      - visuaml-client/backend/tests/test_kan_symbolic_frontend_v45.py
      - .github/workflows/kan-mechanisms-v45.yml
  pull_request:
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/kan_mechanism_ir_v45.py
      - visuaml-client/backend/visuaml/compiler_lab/kan_symbolic_frontend_v45.py
      - visuaml-client/backend/scripts/probe_kan_mechanisms_v45.py
      - visuaml-client/backend/tests/test_kan_mechanism_ir_v45.py
      - visuaml-client/backend/tests/test_kan_symbolic_frontend_v45.py
      - .github/workflows/kan-mechanisms-v45.yml
permissions:
  contents: read
jobs:
  kan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical, SMT, WASM and regression dependencies
        run: |
          python -m pip install torch==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==2.2.6 pytest==8.4.2 wasmtime==28.0.0 z3-solver==4.13.4.0 ruff==0.17.5
      - name: Validate typed KAN/MultKAN, four edge families, symbolic compositional proof, causal guards
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m pytest -q visuaml-client/backend/tests/test_kan_mechanism_ir_v45.py visuaml-client/backend/tests/test_kan_symbolic_frontend_v45.py visuaml-client/backend/tests/test_neural_symbolic_archive_v43.py
          ruff check visuaml-client/backend/visuaml/compiler_lab/kan_mechanism_ir_v45.py visuaml-client/backend/visuaml/compiler_lab/kan_symbolic_frontend_v45.py visuaml-client/backend/tests/test_kan_mechanism_ir_v45.py visuaml-client/backend/tests/test_kan_symbolic_frontend_v45.py visuaml-client/backend/scripts/probe_kan_mechanisms_v45.py
      - name: Independently replay v41 neural through KAN and typed WASM in 256-point signed-i8 domain
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          VISUAML_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p evidence-v45
          python visuaml-client/backend/scripts/probe_kan_mechanisms_v45.py --output evidence-v45/kan-mechanisms-v45.json
          python - <<'PY'
          import json
          d=json.load(open("evidence-v45/kan-mechanisms-v45.json"))
          assert d["schema"] == "visuaml.kan-symbolic-construction-replay.v45"
          assert d["independently_normalized_polynomial_coefficients"] == ["7", "-3", "1"]
          assert d["full_domain_bounded_witnesses"] == 256
          assert all(w["pass"] for w in d["witnesses"])
          assert {x["basis"] for x in d["basis_extensions"]} == {"polynomial","linear_spline","gaussian_rbf","fourier"}
          assert all(x["all_passed"] for x in d["basis_extensions"])
          assert d["all_i32_symbolic_vs_original_wasm"]["solver_outcome"] == "unsat"
          assert d["kan_is_pretrained_mechanism"] is False
          assert d["pretrained_feature_discovery_completed"] is False
          assert d["all_i32_kan_graph_proved"] is False
          assert d["kan_speedup_measured"] is False
          print("KAN graph and independent Wasmtime replay passed")
          PY
      - name: Upload original KAN witnesses and exact graph provenance
        uses: actions/upload-artifact@v4
        with:
          name: typed-kan-mechanisms-v45
          path: evidence-v45/kan-mechanisms-v45.json
          if-no-files-found: error
          retention-days: 30
