name: v14 one-shot source formatting and certificate regeneration
on:
  push:
    branches: [feat/compiler-ir-backends-assembly-spike]
    paths: ['.github/workflows/v14-release-cleanup.yml']
permissions:
  contents: write
jobs:
  format-and-certify:
    if: github.repository == 'Caerii/VisuaML'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compiler-ir-backends-assembly-spike
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install release formatting and reference dependencies
        run: |
          python -m pip install 'numpy==2.1.3' 'pytest==8.3.4' 'ruff==0.17.4'
          python -m pip install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          pnpm install --frozen-lockfile
      - name: Format v14 Python sources and apply safe lint fixes
        run: |
          ruff check --fix visuaml-client/backend/visuaml/compiler_lab/stacked_decoder_v14.py visuaml-client/backend/visuaml/compiler_lab/stacked_certification_v14.py visuaml-client/backend/tests/test_stacked_decoder_v14.py visuaml-client/backend/tests/test_stacked_certification_v14.py visuaml-client/backend/scripts/generate_stacked_certificate_v14.py || true
          ruff format visuaml-client/backend/visuaml/compiler_lab/stacked_decoder_v14.py visuaml-client/backend/visuaml/compiler_lab/stacked_certification_v14.py visuaml-client/backend/tests/test_stacked_decoder_v14.py visuaml-client/backend/tests/test_stacked_certification_v14.py visuaml-client/backend/scripts/generate_stacked_certificate_v14.py
          ruff check visuaml-client/backend/visuaml/compiler_lab/stacked_decoder_v14.py visuaml-client/backend/visuaml/compiler_lab/stacked_certification_v14.py visuaml-client/backend/tests/test_stacked_decoder_v14.py visuaml-client/backend/tests/test_stacked_certification_v14.py visuaml-client/backend/scripts/generate_stacked_certificate_v14.py
      - name: Reissue certificate from pinned GitHub sources
        run: |
          PYTHONPATH=visuaml-client/backend python visuaml-client/backend/scripts/generate_stacked_certificate_v14.py --output visuaml-client/public/stacked_decoder_certificate.v14.json
          pnpm --dir visuaml-client exec prettier --write src/ui/ArchitectureAtlas/StackedDecoderEvidence.tsx public/stacked_decoder_certificate.v14.json
      - name: Verify before committing
        run: |
          PYTHONPATH=visuaml-client/backend python -m pytest -q visuaml-client/backend/tests/test_stacked_decoder_v14.py visuaml-client/backend/tests/test_stacked_certification_v14.py
          pnpm --dir visuaml-client exec prettier --check src/ui/ArchitectureAtlas/StackedDecoderEvidence.tsx public/stacked_decoder_certificate.v14.json
      - name: Commit validated v14 release cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visuaml-client/backend/visuaml/compiler_lab/stacked_decoder_v14.py visuaml-client/backend/visuaml/compiler_lab/stacked_certification_v14.py visuaml-client/backend/tests/test_stacked_decoder_v14.py visuaml-client/backend/tests/test_stacked_certification_v14.py visuaml-client/backend/scripts/generate_stacked_certificate_v14.py visuaml-client/src/ui/ArchitectureAtlas/StackedDecoderEvidence.tsx visuaml-client/public/stacked_decoder_certificate.v14.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(v14): format compiler and regenerate source-bound certificate"
            git push origin HEAD:feat/compiler-ir-backends-assembly-spike
          fi
