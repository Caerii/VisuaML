name: v56 fixed-weight full-i32 neural ALU and WASM replay
on:
  push:
    branches:
      - research/v56-fixed-weight-neural-alu
      - main
    paths:
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_alu_v56.py'
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_alu_executor_v56.py'
      - 'visuaml-client/backend/tests/test_neural_alu_v56.py'
      - 'visuaml-client/backend/tests/test_neural_alu_executor_v56.py'
      - 'visuaml-client/backend/tests/test_generated_wasm_alu_v56.py'
      - '.github/workflows/neural-alu-v56.yml'
  pull_request:
    paths:
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_alu_v56.py'
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_alu_executor_v56.py'
      - 'visuaml-client/backend/tests/test_neural_alu_v56.py'
      - 'visuaml-client/backend/tests/test_neural_alu_executor_v56.py'
      - 'visuaml-client/backend/tests/test_generated_wasm_alu_v56.py'
      - '.github/workflows/neural-alu-v56.yml'
jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact backend dependencies and Wasmtime
        run: |
          python -m pip install torch==2.9.1+cpu torchvision==0.24.1+cpu torchaudio==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r visuaml-client/backend/requirements.txt
          python -m pip install pytest ruff 'wasmtime>=20,<50'
      - name: Lint constructed ALU and run independent source-WASM differential
        run: |
          ruff check visuaml-client/backend/visuaml/compiler_lab/neural_alu_v56.py visuaml-client/backend/visuaml/compiler_lab/neural_alu_executor_v56.py visuaml-client/backend/tests/test_neural_alu_v56.py visuaml-client/backend/tests/test_neural_alu_executor_v56.py visuaml-client/backend/tests/test_generated_wasm_alu_v56.py
          PYTHONPATH=visuaml-client/backend python -m pytest -q visuaml-client/backend/tests/test_neural_alu_v56.py visuaml-client/backend/tests/test_neural_alu_executor_v56.py visuaml-client/backend/tests/test_generated_wasm_alu_v56.py
