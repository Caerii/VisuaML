name: v51 structured WASM control flow and bit-neural arithmetic differential
on:
  push:
    branches:
      - research/v51-wasm-structured-control
      - main
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/wasm_control_flow_v51.py
      - visuaml-client/backend/tests/test_wasm_control_flow_v51.py
      - visuaml-client/backend/tests/test_wasm_control_archive_v51.py
      - benchmarks/wasm_structured_control_v51.json
      - benchmarks/wasm_structured_control_v51.origin.json
      - docs/WASM_CONFORMANCE_LEDGER_V51.json
      - visuaml-client/backend/scripts/probe_wasm_control_flow_v51.py
      - visuaml-client/backend/scripts/probe_wasm_gcd_v51_1.py
      - visuaml-client/backend/tests/test_wasm_gcd_archive_v51_1.py
      - benchmarks/wasm_control_gcd_v51_1.json
      - benchmarks/wasm_control_gcd_v51_1.origin.json
      - .github/workflows/wasm-structured-control-v51.yml
  pull_request:
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/wasm_control_flow_v51.py
      - visuaml-client/backend/tests/test_wasm_control_flow_v51.py
      - visuaml-client/backend/tests/test_wasm_control_archive_v51.py
      - benchmarks/wasm_structured_control_v51.json
      - benchmarks/wasm_structured_control_v51.origin.json
      - docs/WASM_CONFORMANCE_LEDGER_V51.json
      - visuaml-client/backend/scripts/probe_wasm_control_flow_v51.py
      - visuaml-client/backend/scripts/probe_wasm_gcd_v51_1.py
      - visuaml-client/backend/tests/test_wasm_gcd_archive_v51_1.py
      - benchmarks/wasm_control_gcd_v51_1.json
      - benchmarks/wasm_control_gcd_v51_1.origin.json
      - .github/workflows/wasm-structured-control-v51.yml
permissions:
  contents: write
jobs:
  structured-control:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned independent Wasmtime and arithmetic dependencies
        run: |
          python -m pip install torch==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==2.2.6 pytest==8.4.2 wasmtime==28.0.0 ruff==0.17.5
      - name: Execute original WASM blocks, loops, branches, return, and fuel controls
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m pytest -q visuaml-client/backend/tests/test_wasm_control_flow_v51.py visuaml-client/backend/tests/test_wasm_control_archive_v51.py visuaml-client/backend/tests/test_wasm_gcd_archive_v51_1.py
          ruff check visuaml-client/backend/visuaml/compiler_lab/wasm_control_flow_v51.py visuaml-client/backend/tests/test_wasm_control_flow_v51.py visuaml-client/backend/scripts/probe_wasm_control_flow_v51.py visuaml-client/backend/tests/test_wasm_control_archive_v51.py visuaml-client/backend/scripts/probe_wasm_gcd_v51_1.py visuaml-client/backend/tests/test_wasm_gcd_archive_v51_1.py
      - name: Record original source WASM, control traces and independent oracle results
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          VISUAML_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p evidence-v51
          python visuaml-client/backend/scripts/probe_wasm_control_flow_v51.py --output evidence-v51/structured-control-v51.json
          python - <<'PY'
          import json
          r=json.load(open("evidence-v51/structured-control-v51.json"))
          assert r["schema"]=="visuaml.structured-control-differential.v51"
          assert r["source_wasm_independently_validated"]
          assert r["real_wasmtime_executed"]
          assert r["all_finite_witnesses_passed"]
          assert r["nonterminating_case_rejected_with_bounded_fuel"]
          assert not r["neural_pc_routing_implemented"]
          assert not r["general_wasm_supported"]
          assert all(x["passed"] for x in r["witnesses"])
          print("Original structured WASM witness count",len(r["witnesses"]))
          PY
      - name: Upload complete source-bound structured-control transition evidence
        uses: actions/upload-artifact@v4
        with:
          name: wasm-structured-control-v51
          path: evidence-v51/structured-control-v51.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve original source-bound control-flow transcript on trusted branch push
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_NAME" != "research/v51-wasm-structured-control" ]; then
            echo "No evidence mutations for pull requests or unrelated branches."
            exit 0
          fi
          if [ -e benchmarks/wasm_structured_control_v51.json ] || [ -e benchmarks/wasm_structured_control_v51.origin.json ]; then
            test -f benchmarks/wasm_structured_control_v51.json
            test -f benchmarks/wasm_structured_control_v51.origin.json
            echo "Original raw evidence already archived; refuse overwrite."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          original=Path("evidence-v51/structured-control-v51.json").read_bytes()
          r=json.loads(original)
          assert r["schema"]=="visuaml.structured-control-differential.v51"
          assert r["source_commit"]==os.environ["GITHUB_SHA"]
          assert r["source_wasm_independently_validated"]
          assert r["real_wasmtime_executed"]
          assert r["all_finite_witnesses_passed"]
          assert r["nonterminating_case_rejected_with_bounded_fuel"]
          assert r["host_fuel_exhaustion_observed"]
          assert r["independent_wasmtime_fuel_exhaustion_observed"]
          assert all(w["passed"] for w in r["witnesses"])
          assert r["program_count"]==5
          assert not r["neural_pc_routing_implemented"]
          assert not r["general_wasm_supported"]
          assert not r["all_possible_input_equivalence_proved"]
          output=Path("benchmarks/wasm_structured_control_v51.json")
          origin=Path("benchmarks/wasm_structured_control_v51.origin.json")
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_bytes(original)
          meta={
            "schema":"visuaml.wasm-structured-control-origin.v51",
            "source_commit":os.environ["GITHUB_SHA"],
            "workflow_run_url":"https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],
            "raw_sha256":hashlib.sha256(original).hexdigest(),
            "raw_bytes":len(original),
            "source_file_sha256":r["source_file_sha256"],
            "program_count":r["program_count"],
            "input_witness_count":len(r["witnesses"]),
            "observed_host_steps":r["total_control_state_transitions"],
            "host_pc_control_only":True,
            "independent_original_wasmtime_validated":True,
            "neural_branch_routing_proved":False,
            "universal_wasm_supported":False,
            "all_input_loop_equivalence_proved":False,
            "external_signed_attestation":False,
          }
          origin.write_text(json.dumps(meta,indent=2,sort_keys=True,allow_nan=False)+"\n",encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/wasm_structured_control_v51.json benchmarks/wasm_structured_control_v51.origin.json
          git commit -m "v51: archive original structured WASM and control-state witnesses [skip ci]"
          git push origin "HEAD:refs/heads/research/v51-wasm-structured-control"

      - name: Verify independent Euclid GCD real WASM algorithm and bounded fuel semantics
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          VISUAML_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python visuaml-client/backend/scripts/probe_wasm_gcd_v51_1.py --output evidence-v51/gcd-v51-1.json
          python - <<'PY'
          import json
          p=json.load(open("evidence-v51/gcd-v51-1.json"))
          assert p["schema"] == "visuaml.real-wasm-gcd-control-evidence.v51.1"
          assert p["sample_count"] == 27
          assert all(w["passed"] for w in p["witnesses"])
          assert p["original_binary_wasmtime_validated"]
          assert p["independent_mathematical_reference_used"]
          assert p["fuel_exhausted_on_mathematically_terminating_large_input"]
          assert not p["fuel_exhaustion_means_nontermination"]
          assert not p["neural_routing_of_branch_targets"]
          assert not p["general_gcd_all_i32_semantics_proved"]
          print("Real original-WASM GCD complete cases",p["sample_count"])
          PY
      - name: Retain extended Euclid GCD original-source proof witnesses
        uses: actions/upload-artifact@v4
        with:
          name: original-wasm-gcd-v51-1
          path: evidence-v51/gcd-v51-1.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve first original GCD proof as a separate immutable version
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_NAME" != "research/v51-wasm-structured-control" ]; then
            echo "No archival mutation on PRs or unrelated branches."
            exit 0
          fi
          if [ -e benchmarks/wasm_control_gcd_v51_1.json ] || [ -e benchmarks/wasm_control_gcd_v51_1.origin.json ]; then
            test -f benchmarks/wasm_control_gcd_v51_1.json
            test -f benchmarks/wasm_control_gcd_v51_1.origin.json
            echo "Do not overwrite original v51.1 GCD proof."
            exit 0
          fi
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          raw=Path("evidence-v51/gcd-v51-1.json").read_bytes()
          r=json.loads(raw)
          assert r["source_commit"]==os.environ["GITHUB_SHA"]
          assert r["sample_count"]==27 and all(w["passed"] for w in r["witnesses"])
          assert r["original_binary_wasmtime_validated"]
          assert not r["general_gcd_all_i32_semantics_proved"]
          assert not r["neural_routing_of_branch_targets"]
          assert r["fuel_exhausted_on_mathematically_terminating_large_input"]
          assert not r["fuel_exhaustion_means_nontermination"]
          base=Path("benchmarks")
          base.mkdir(parents=True,exist_ok=True)
          (base/"wasm_control_gcd_v51_1.json").write_bytes(raw)
          meta={
            "schema":"visuaml.real-wasm-gcd-origin.v51.1",
            "source_commit":os.environ["GITHUB_SHA"],
            "run_url":"https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],
            "raw_sha256":hashlib.sha256(raw).hexdigest(),
            "raw_bytes":len(raw),
            "source_file_sha256":r["source_file_sha256"],
            "original_source_wasm_sha256":r["gcd_12_source_wasm_sha256"],
            "mathematical_reference_confirmed":True,
            "all_27_wasmtime_witnesses_passed":True,
            "fuel_limited_result_is_not_nontermination":True,
            "neural_branch_routing_proved":False,
            "all_input_equivalence_proved":False,
            "external_signature_present":False,
          }
          (base/"wasm_control_gcd_v51_1.origin.json").write_text(
            json.dumps(meta,indent=2,sort_keys=True,allow_nan=False)+"\n",
            encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/wasm_control_gcd_v51_1.json benchmarks/wasm_control_gcd_v51_1.origin.json
          git commit -m "v51.1: preserve original Euclid WASM GCD proof with source CI origin [skip ci]"
          git push origin "HEAD:refs/heads/research/v51-wasm-structured-control"
