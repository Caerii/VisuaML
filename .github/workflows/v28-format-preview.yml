name: v28 source formatting preview (temporary)
on:
  push:
    branches:
      - feat/native-cpu-research-studio-v28
    paths:
      - .github/workflows/v28-format-preview.yml
jobs:
  formatted-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - name: Run project-prettier and emit exact source blobs
        run: |
          pnpm --dir visuaml-client exec prettier --write \
            src/ui/CompilerLab/CompilerLab.css \
            src/ui/CompilerLab/CompilerLabPage.tsx \
            src/ui/CompilerLab/SemanticExecutionPanel.tsx \
            src/ui/DocsPage/DocsContent.data.ts \
            src/ui/DocsPage/DocsPage.tsx \
            src/ui/LandingPage/LandingHeader.tsx \
            src/ui/LandingPage/LandingHero.tsx \
            src/ui/Roadmap/roadmapModel.test.ts \
            src/ui/Roadmap/roadmapModel.ts \
            src/ui/Roadmap/RoadmapPage.css \
            src/ui/Roadmap/RoadmapPage.tsx
          python3 - <<'PY'
          import base64
          from pathlib import Path
          files = (
              "src/ui/CompilerLab/CompilerLab.css",
              "src/ui/CompilerLab/CompilerLabPage.tsx",
              "src/ui/CompilerLab/SemanticExecutionPanel.tsx",
              "src/ui/DocsPage/DocsContent.data.ts",
              "src/ui/DocsPage/DocsPage.tsx",
              "src/ui/LandingPage/LandingHeader.tsx",
              "src/ui/LandingPage/LandingHero.tsx",
              "src/ui/Roadmap/roadmapModel.test.ts",
              "src/ui/Roadmap/roadmapModel.ts",
              "src/ui/Roadmap/RoadmapPage.css",
              "src/ui/Roadmap/RoadmapPage.tsx",
          )
          for relative in files:
              file = Path("visuaml-client") / relative
              print(f"V28_FORMAT_BEGIN {file}", flush=True)
              print(base64.b64encode(file.read_bytes()).decode("ascii"), flush=True)
              print(f"V28_FORMAT_END {file}", flush=True)
          PY
