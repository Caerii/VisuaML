name: v55 exact neural operand storage prototype
on:
  push:
    branches:
      - research/v55-neural-operand-storage
      - main
    paths:
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_operand_storage_v55.py'
      - 'visuaml-client/backend/tests/test_neural_operand_storage_v55.py'
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_operand_adapter_v55.py'
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_operand_executor_v55.py'
      - 'visuaml-client/backend/tests/test_neural_operand_executor_v55.py'
      - '.github/workflows/neural-operand-storage-v55.yml'
  pull_request:
    paths:
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_operand_storage_v55.py'
      - 'visuaml-client/backend/tests/test_neural_operand_storage_v55.py'
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_operand_adapter_v55.py'
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_operand_executor_v55.py'
      - 'visuaml-client/backend/tests/test_neural_operand_executor_v55.py'
      - '.github/workflows/neural-operand-storage-v55.yml'
jobs:
  operand-circuit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies and test tools
        run: |
          python -m pip install torch==2.9.1+cpu torchvision==0.24.1+cpu torchaudio==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r visuaml-client/backend/requirements.txt
          python -m pip install pytest ruff 'wasmtime>=20,<50'
      - name: Exact bit-sliced operand storage and adversarial tests
        run: |
          ruff check visuaml-client/backend/visuaml/compiler_lab/neural_operand_storage_v55.py visuaml-client/backend/tests/test_neural_operand_storage_v55.py visuaml-client/backend/visuaml/compiler_lab/neural_operand_adapter_v55.py visuaml-client/backend/visuaml/compiler_lab/neural_operand_executor_v55.py visuaml-client/backend/tests/test_neural_operand_executor_v55.py
          PYTHONPATH=visuaml-client/backend python -m pytest -q visuaml-client/backend/tests/test_neural_operand_storage_v55.py visuaml-client/backend/tests/test_neural_operand_executor_v55.py
