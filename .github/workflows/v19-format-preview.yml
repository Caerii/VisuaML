name: v19 formatting preview (temporary)
on:
  push:
    branches:
      - feat/compiler-ir-backends-assembly-spike
jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - name: Emit fully formatted source for reviewed commit
        run: |
          pnpm --dir visuaml-client exec prettier --write server/semanticInspection.ts src/ui/ArchitectureAtlas/SemanticDecoderEvidence.tsx
          python3 - <<'PY'
          from pathlib import Path
          import base64
          for relative in ('server/semanticInspection.ts', 'src/ui/ArchitectureAtlas/SemanticDecoderEvidence.tsx'):
              file = Path('visuaml-client') / relative
              print('V19_FMT_BEGIN ' + str(file), flush=True)
              print(base64.b64encode(file.read_bytes()).decode('ascii'), flush=True)
              print('V19_FMT_END ' + str(file), flush=True)
          PY
