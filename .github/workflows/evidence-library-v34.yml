name: Compounding research evidence library v34
on:
  push:
    branches:
      - main
    paths:
      - visuaml-client/backend/visuaml_evidence/library_v34.py
      - visuaml-client/backend/visuaml_evidence/__init__.py
      - visuaml-client/backend/tests/test_evidence_library_v34.py
      - visuaml-client/backend/scripts/build_evidence_library_v34.py
      - benchmarks/native_online_attention_observation_v31.json
      - benchmarks/native_semantic_codegen_observation_v32.json
      - benchmarks/export_evidence_observation_v33.json
      - benchmarks/export_evidence_observation_v33.origin.json
      - visuaml-client/public/evidence/library-v34.json
      - .github/workflows/evidence-library-v34.yml
  pull_request:
    paths:
      - visuaml-client/backend/visuaml_evidence/library_v34.py
      - visuaml-client/backend/tests/test_evidence_library_v34.py
      - visuaml-client/backend/scripts/build_evidence_library_v34.py
      - benchmarks/native_online_attention_observation_v31.json
      - benchmarks/native_semantic_codegen_observation_v32.json
      - benchmarks/export_evidence_observation_v33.json
      - benchmarks/export_evidence_observation_v33.origin.json
      - visuaml-client/public/evidence/library-v34.json
      - .github/workflows/evidence-library-v34.yml

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic admission test dependencies
        run: |
          python -m pip install pytest ruff
      - name: Lint compounding evidence library
        run: |
          ruff check visuaml-client/backend/visuaml_evidence visuaml-client/backend/tests/test_evidence_library_v34.py visuaml-client/backend/scripts/build_evidence_library_v34.py
      - name: Verify repository historical artifacts and fail-closed records
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
        run: |
          python -m pytest -q visuaml-client/backend/tests/test_evidence_library_v34.py
      - name: Build reproducible public catalog from reviewed artifacts
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
        run: |
          python visuaml-client/backend/scripts/build_evidence_library_v34.py --output /tmp/library-v34.json
          python -c "import json; d=json.load(open('/tmp/library-v34.json')); assert d['schema']=='visuaml.evidence-library.v34' and d['counts']['source_artifacts']==3 and d['counts']['studies']==12"
      - name: Verify checked-in catalog has not drifted
        if: hashFiles('visuaml-client/public/evidence/library-v34.json') != ''
        env:
          PYTHONPATH: visuaml-client/backend
        run: |
          python visuaml-client/backend/scripts/build_evidence_library_v34.py --check
      - name: Upload vetted multi-version catalog
        uses: actions/upload-artifact@v4
        with:
          name: vetted-evidence-library-v34
          path: /tmp/library-v34.json
          if-no-files-found: error
          retention-days: 30
