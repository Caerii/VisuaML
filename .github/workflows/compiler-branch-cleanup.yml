name: Feature-branch mechanical cleanup (one-shot)
on:
  push:
    branches: [feat/compiler-ir-backends-assembly-spike]
    paths: ['.github/workflows/compiler-branch-cleanup.yml']
permissions:
  contents: write
jobs:
  format-once:
    runs-on: ubuntu-latest
    if: github.repository == 'Caerii/VisuaML'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compiler-ir-backends-assembly-spike
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install ruff==0.17.4
      - run: pnpm install --frozen-lockfile
      - name: Apply reviewed legacy backend remediation
        run: python scripts/repair_legacy_quality.py
      - name: Apply mechanical Ruff fixes and Python formatting
        run: |
          ruff check --fix visuaml-client/backend || test "$?" = 1
          ruff format visuaml-client/backend
      - name: Enforce complete Ruff gate after remediation
        run: ruff check visuaml-client/backend
      - name: Prettier formatting (repository-wide)
        run: pnpm --dir visuaml-client exec prettier --write .
      - name: Verify source builds and tests before writing
        run: |
          pnpm --filter visuaml-client run lint
          pnpm --filter visuaml-client run test -- --run
          pnpm --filter visuaml-client run build
      - name: Commit safe formatting-only + automated lint fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visuaml-client
          if ! git diff --cached --quiet; then
            git commit -m "chore: mechanically format source and apply safe Ruff fixes"
            git push origin HEAD:feat/compiler-ir-backends-assembly-spike
          fi
