name: Temporary v34 checked catalog publisher
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v34-publish-once.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == 'Caerii/VisuaML'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v34-compounding-evidence-library
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate deterministic reviewed v34 catalog
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
        run: |
          python visuaml-client/backend/scripts/build_evidence_library_v34.py
          python visuaml-client/backend/scripts/build_evidence_library_v34.py --check
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile
      - name: Format static catalog and the evidence library UI
        run: |
          pnpm --dir visuaml-client exec prettier --write src/ui/ResearchEvidence/libraryModel.ts src/ui/ResearchEvidence/libraryModel.test.ts src/ui/ResearchEvidence/ResearchLibraryPage.tsx
      - name: Commit generated catalog and exact formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visuaml-client/public/evidence/library-v34.json visuaml-client/src/ui/ResearchEvidence/libraryModel.ts visuaml-client/src/ui/ResearchEvidence/libraryModel.test.ts visuaml-client/src/ui/ResearchEvidence/ResearchLibraryPage.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(v34): publish exact catalog and project-formatted evidence browser'
            git fetch origin research/v34-compounding-evidence-library
            git rebase origin/research/v34-compounding-evidence-library
            git push origin HEAD:research/v34-compounding-evidence-library
          fi
