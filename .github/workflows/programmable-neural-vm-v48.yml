name: v48 constructed multi-program neural token VM and original WASM replay
on:
  push:
    branches:
      - research/v48-programmable-neural-token-vm
      - main
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/fixed_neural_token_vm_v48.py
      - visuaml-client/backend/tests/test_fixed_neural_token_vm_v48.py
      - visuaml-client/backend/scripts/probe_neural_token_vm_v48.py
      - docs/V48_NEURAL_VM_WASM_FRONTIER.md
      - benchmarks/neural_multivm_v48.json
      - benchmarks/neural_multivm_v48.origin.json
      - .github/workflows/programmable-neural-vm-v48.yml
  pull_request:
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/fixed_neural_token_vm_v48.py
      - visuaml-client/backend/tests/test_fixed_neural_token_vm_v48.py
      - visuaml-client/backend/scripts/probe_neural_token_vm_v48.py
      - docs/V48_NEURAL_VM_WASM_FRONTIER.md
      - benchmarks/neural_multivm_v48.json
      - benchmarks/neural_multivm_v48.origin.json
      - .github/workflows/programmable-neural-vm-v48.yml
permissions:
  contents: write
jobs:
  fixed-neural-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned independent Wasmtime and numerical reference tools
        run: |
          python -m pip install torch==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==2.2.6 pytest==8.4.2 wasmtime==28.0.0 z3-solver==4.13.4.0 ruff==0.17.5
      - name: Run 7-program full-domain neural machine versus reference and adversarial tests
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m pytest -q visuaml-client/backend/tests/test_fixed_neural_token_vm_v48.py
          python -m pytest -q visuaml-client/backend/tests/test_wasm_state_vm_v40.py
          ruff check visuaml-client/backend/visuaml/compiler_lab/fixed_neural_token_vm_v48.py visuaml-client/backend/tests/test_fixed_neural_token_vm_v48.py visuaml-client/backend/scripts/probe_neural_token_vm_v48.py
      - name: Publish complete fixed-weight seven-program and stepwise original WASM replay
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          VISUAML_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p evidence-v48
          python visuaml-client/backend/scripts/probe_neural_token_vm_v48.py --output evidence-v48/neural-multivm-v48.json
          python - <<'PY'
          import json
          r=json.load(open("evidence-v48/neural-multivm-v48.json"))
          assert r["schema"]=="visuaml.multi-program-neural-matrix-vm-evidence.v48"
          assert r["number_of_programs"]==7 and r["total_output_witnesses"]==1792
          assert r["fixed_weights_reused_without_retraining"]
          assert len({p["fixed_weights_sha256"] for p in r["programs"]})==1
          assert r["independent_wasmtime_executed"] and r["independent_v40_per_instruction_state_compared"]
          assert all(w["passed"] for w in r["witnesses"])
          assert r["nonidentifiability_smt"]["solver_result"]=="unsat"
          assert not r["nonidentifiability_smt"]["unique_source_recovered_from_behavior"]
          assert not r["standard_transformer_layer_weights_constructed"]
          assert not r["general_wasm_mvp_supported"]
          assert not r["arbitrary_neural_weight_decompilation"]
          assert not r["i32_modular_overflow_semantics_supported"]
          print("Neural routing weights reused across seven distinct original WASM programs")
          PY
      - name: Upload raw source-bound complete original program-state transcript
        uses: actions/upload-artifact@v4
        with:
          name: fixed-neural-multiwasm-v48
          path: evidence-v48/neural-multivm-v48.json
          if-no-files-found: error
          retention-days: 30

      - name: Guarded permanent original program and trace archive
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_NAME" != "research/v48-programmable-neural-token-vm" ]; then
            echo "Untrusted or unrelated event: no archival write."
            exit 0
          fi
          if [ -e benchmarks/neural_multivm_v48.json ] || [ -e benchmarks/neural_multivm_v48.origin.json ]; then
            test -f benchmarks/neural_multivm_v48.json
            test -f benchmarks/neural_multivm_v48.origin.json
            echo "Immutable v48 original record already exists; refuse overwrite."
            exit 0
          fi
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          raw = Path("evidence-v48/neural-multivm-v48.json").read_bytes()
          data = json.loads(raw)
          assert data["schema"] == "visuaml.multi-program-neural-matrix-vm-evidence.v48"
          assert data["source_commit"] == os.environ["GITHUB_SHA"]
          assert data["number_of_programs"] == 7
          assert data["total_output_witnesses"] == 1792
          assert all(item["passed"] for item in data["witnesses"])
          assert len({p["fixed_weights_sha256"] for p in data["programs"]}) == 1
          assert data["nonidentifiability_smt"]["solver_result"] == "unsat"
          assert data["independent_wasmtime_executed"]
          assert data["independent_v40_per_instruction_state_compared"]
          assert not data["general_wasm_mvp_supported"]
          assert not data["arbitrary_neural_weight_decompilation"]
          assert not data["i32_modular_overflow_semantics_supported"]
          folder = Path("benchmarks")
          folder.mkdir(parents=True, exist_ok=True)
          archive = folder / "neural_multivm_v48.json"
          origin = folder / "neural_multivm_v48.origin.json"
          if archive.exists() or origin.exists():
            raise SystemExit("Refuse partially conflicting original evidence")
          archive.write_bytes(raw)
          meta = {
              "schema": "visuaml.neural-multivm-origin.v48",
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run_url": (
                  "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
                  + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
              ),
              "artifact_name": "fixed-neural-multiwasm-v48",
              "raw_sha256": hashlib.sha256(raw).hexdigest(),
              "raw_bytes": len(raw),
              "source_file_sha256": data["source_file_sha256"],
              "fixed_weights_sha256": data["fixed_weights_sha256"],
              "number_of_programs": data["number_of_programs"],
              "number_of_witnesses": data["total_output_witnesses"],
              "reference_wasmtime_executed": True,
              "full_wasm_3_compliant": False,
              "arbitrary_pretrained_model_decompiled": False,
              "signed_external_attestation": False,
          }
          origin.write_text(
              json.dumps(meta, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/neural_multivm_v48.json benchmarks/neural_multivm_v48.origin.json
          git commit -m "v48: archive original multi-program neural execution evidence [skip ci]"
          git push origin "HEAD:refs/heads/research/v48-programmable-neural-token-vm"
