name: Temporary v33 exact client formatter
on:
  push:
    branches:
      - research/v33-export-evidence-spine
    paths:
      - .github/workflows/v33-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile
      - name: Apply exact project formatter
        run: |
          pnpm --dir visuaml-client exec prettier --write public/evidence/v33-observation.json src/ui/ResearchEvidence/evidenceModel.ts src/ui/ResearchEvidence/ResearchEvidencePage.tsx
      - name: Commit only deterministic formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visuaml-client/public/evidence/v33-observation.json visuaml-client/src/ui/ResearchEvidence/evidenceModel.ts visuaml-client/src/ui/ResearchEvidence/ResearchEvidencePage.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(v33): apply exact Prettier output to research evidence page"
            git push origin HEAD:research/v33-export-evidence-spine
          fi
