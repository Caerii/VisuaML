name: v43 manifest-free neural to symbolic and all-i32 SMT verification
on:
  push:
    branches:
      - research/v43-neural-symbolic-recovery
      - main
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/neural_symbolic_recovery_v43.py
      - visuaml-client/backend/tests/test_neural_symbolic_recovery_v43.py
      - visuaml-client/backend/tests/test_neural_symbolic_archive_v43.py
      - benchmarks/neural_symbolic_roundtrip_v43.json
      - benchmarks/neural_symbolic_roundtrip_v43.origin.json
      - visuaml-client/backend/scripts/probe_neural_symbolic_v43.py
      - .github/workflows/neural-symbolic-v43.yml
      - docs/V43_NEURAL_SYMBOLIC_VERIFICATION.md
  pull_request:
    paths:
      - visuaml-client/backend/visuaml/compiler_lab/neural_symbolic_recovery_v43.py
      - visuaml-client/backend/tests/test_neural_symbolic_recovery_v43.py
      - visuaml-client/backend/tests/test_neural_symbolic_archive_v43.py
      - benchmarks/neural_symbolic_roundtrip_v43.json
      - benchmarks/neural_symbolic_roundtrip_v43.origin.json
      - visuaml-client/backend/scripts/probe_neural_symbolic_v43.py
      - .github/workflows/neural-symbolic-v43.yml
      - docs/V43_NEURAL_SYMBOLIC_VERIFICATION.md
permissions:
  contents: write
jobs:
  symbolic-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical, WASM, SMT and testing dependencies
        run: |
          python -m pip install torch==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==2.2.6 pytest==8.4.2 wasmtime==28.0.0 z3-solver==4.13.4.0 ruff==0.17.5
      - name: Verify extraction and adversarial rejection against native/WASM/SMT
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m pytest -q visuaml-client/backend/tests/test_neural_symbolic_recovery_v43.py visuaml-client/backend/tests/test_analytic_relu_specialization_v41.py visuaml-client/backend/tests/test_analytic_neural_archive_v41.py visuaml-client/backend/tests/test_neural_symbolic_archive_v43.py
          ruff check visuaml-client/backend/visuaml/compiler_lab/neural_symbolic_recovery_v43.py visuaml-client/backend/tests/test_neural_symbolic_recovery_v43.py visuaml-client/backend/scripts/probe_neural_symbolic_v43.py visuaml-client/backend/tests/test_neural_symbolic_archive_v43.py
      - name: Independently prove original versus reconstructed i32 and replay 326 cases
        env:
          PYTHONPATH: visuaml-client/backend
          PYTHONNOUSERSITE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          VISUAML_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p evidence-v43
          python visuaml-client/backend/scripts/probe_neural_symbolic_v43.py --output evidence-v43/neural-symbolic-v43.json
          python - <<'PY'
          import json
          record=json.load(open("evidence-v43/neural-symbolic-v43.json"))
          assert record["schema"]=="visuaml.verified-neural-symbolic-roundtrip.v43"
          assert record["polynomial"]["a"] == 1 and record["polynomial"]["b"] == -3 and record["polynomial"]["c"] == 7
          assert record["all_i32_symbolic_vs_source_smt"]["solver_outcome"] == "unsat"
          assert record["wrong_symbolic_hypothesis_smt"]["solver_outcome"] == "sat"
          assert record["exact_bounded_neural_witness_count"] == 256
          assert record["runtime_witness_count"] == 326
          assert all(x["pass"] for x in record["observations"])
          assert record["outside_domain_neural_counterexample"]["different"] is True
          assert record["neural_all_i32_equivalent"] is False
          assert record["arbitrary_learned_neural_program_decompiled"] is False
          assert record["smt_result_is_machine_checked_proof_object"] is False
          print("Bitvector proof unsat; all 326 runtime observations passed")
          PY
      - name: Retain complete original SMT, symbolic, WASM and C++17 witness
        uses: actions/upload-artifact@v4
        with:
          name: neural-symbolic-i32-v43
          path: evidence-v43/neural-symbolic-v43.json
          if-no-files-found: error
          retention-days: 30

      - name: Permanently archive first passing v43 proof and original raw transcript
        env:
          PYTHONNOUSERSITE: "1"
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_NAME" != "research/v43-neural-symbolic-recovery" ]; then
            echo "Writes prohibited from pull requests and unrelated branches."
            exit 0
          fi
          if [ -e benchmarks/neural_symbolic_roundtrip_v43.json ] || [ -e benchmarks/neural_symbolic_roundtrip_v43.origin.json ]; then
            test -f benchmarks/neural_symbolic_roundtrip_v43.json
            test -f benchmarks/neural_symbolic_roundtrip_v43.origin.json
            echo "Historical evidence already exists; will not overwrite."
            exit 0
          fi
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          raw = Path("evidence-v43/neural-symbolic-v43.json").read_bytes()
          record = json.loads(raw)
          assert record["schema"] == "visuaml.verified-neural-symbolic-roundtrip.v43"
          assert record["github_source_commit"] == os.environ["GITHUB_SHA"]
          assert record["all_i32_symbolic_vs_source_smt"]["solver_outcome"] == "unsat"
          assert record["wrong_symbolic_hypothesis_smt"]["solver_outcome"] == "sat"
          assert record["exact_bounded_neural_witness_count"] == 256
          assert record["runtime_witness_count"] == 326
          assert all(w["pass"] for w in record["observations"])
          assert record["outside_domain_neural_counterexample"]["different"]
          assert not record["neural_all_i32_equivalent"]
          assert not record["arbitrary_learned_neural_program_decompiled"]
          assert not record["smt_result_is_machine_checked_proof_object"]
          path=Path("benchmarks/neural_symbolic_roundtrip_v43.json")
          origin=Path("benchmarks/neural_symbolic_roundtrip_v43.origin.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(raw)
          manifest={
              "schema": "visuaml.neural-symbolic-origin.v43",
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run_url": "https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],
              "raw_bytes": len(raw),
              "raw_sha256": hashlib.sha256(raw).hexdigest(),
              "source_file_sha256": record["source_file_sha256"],
              "historical_v41_raw_sha256": record["historical_v41_raw_sha256"],
              "source_wasm_sha256": record["original_wasm_sha256"],
              "recovered_wasm_sha256": record["compiled_wasm_sha256"],
              "native_binary_sha256": record["compiled_native_binary_sha256"],
              "recovered_polynomial_sha256": record["all_i32_symbolic_vs_source_smt"]["symbolic_candidate_sha256"],
              "smt_outcome": "unsat",
              "negative_control_smt_outcome": "sat",
              "neural_domain": [-128,127],
              "neural_domain_not_extended": True,
              "independent_wasmtime_and_cpp": True,
              "authentication": "GitHub Actions CI-origin metadata and digests; not a signed proof object",
          }
          origin.write_text(json.dumps(manifest,indent=2,sort_keys=True,allow_nan=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/neural_symbolic_roundtrip_v43.json benchmarks/neural_symbolic_roundtrip_v43.origin.json
          git commit -m "v43: archive all-i32 symbolic SMT and bounded neural witnesses [skip ci]"
          git push origin "HEAD:refs/heads/research/v43-neural-symbolic-recovery"
