name: Stateful assembly reference parity
on:
  push:
    branches: [feat/compiler-ir-backends-assembly-spike]
    paths:
      - '.github/workflows/stateful-reference-parity.yml'
      - 'visuaml-client/backend/visuaml/compiler_lab/stateful_ir.py'
      - 'visuaml-client/backend/visuaml/compiler_lab/assembly_state.py'
      - 'visuaml-client/backend/tests/test_stateful_assembly_v6.py'
      - 'visuaml-client/backend/visuaml/compiler_lab/assembly_schedule.py'
      - 'visuaml-client/backend/tests/test_v10_integration.py'
      - 'visuaml-client/backend/visuaml/compiler_lab/multi_area_bridge.py'
      - 'visuaml-client/backend/tests/test_multi_area_bridge_v8.py'
      - 'visuaml-client/backend/visuaml/compiler_lab/multifiber_bridge.py'
      - 'visuaml-client/backend/tests/test_multifiber_bridge_v9.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-reference:
    name: Compare against pinned neural-assemblies implementation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated reference environment
        run: |
          python -m pip install 'pytest==8.3.4' 'numpy==2.1.3'
          python -m pip install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'git+https://github.com/Caerii/assemblies.git@7b9a4d1f9e0401db44b0cfd12997bd6b9468051c'
      - name: Test actual explicit engine and stateful compiler semantics
        env:
          PYTHONPATH: visuaml-client/backend
        run: |
          python -c 'import neural_assemblies; print(neural_assemblies.__file__)'
          python -m pytest -q visuaml-client/backend/tests/test_stateful_assembly_v6.py
          python -m pytest -q visuaml-client/backend/tests/test_v10_integration.py::test_generic_schedule_vs_pinned_explicit_reference visuaml-client/backend/tests/test_multi_area_bridge_v8.py visuaml-client/backend/tests/test_multifiber_bridge_v9.py
