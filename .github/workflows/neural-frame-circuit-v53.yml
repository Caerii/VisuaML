name: v53 bounded neural frame circuit prototype
on:
  push:
    branches:
      - research/v53-neural-control-frame-circuits
      - main
    paths:
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_frame_circuit_v53.py'
      - 'visuaml-client/backend/tests/test_neural_frame_circuit_v53.py'
      - 'visuaml-client/backend/tests/test_neural_frame_replay_v53.py'
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_frame_replay_v53.py'
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_frame_executor_v53.py'
      - 'visuaml-client/backend/tests/test_neural_frame_executor_v53.py'
      - '.github/workflows/neural-frame-circuit-v53.yml'
  pull_request:
    paths:
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_frame_circuit_v53.py'
      - 'visuaml-client/backend/tests/test_neural_frame_circuit_v53.py'
      - 'visuaml-client/backend/tests/test_neural_frame_replay_v53.py'
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_frame_replay_v53.py'
      - 'visuaml-client/backend/visuaml/compiler_lab/neural_frame_executor_v53.py'
      - 'visuaml-client/backend/tests/test_neural_frame_executor_v53.py'
      - '.github/workflows/neural-frame-circuit-v53.yml'
jobs:
  frame-circuit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies and test tools
        run: |
          python -m pip install torch==2.9.1+cpu torchvision==0.24.1+cpu torchaudio==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r visuaml-client/backend/requirements.txt
          python -m pip install pytest ruff 'wasmtime>=20,<50'
      - name: Check circuit and focused tests
        run: |
          ruff check visuaml-client/backend/visuaml/compiler_lab/neural_frame_circuit_v53.py visuaml-client/backend/tests/test_neural_frame_circuit_v53.py visuaml-client/backend/visuaml/compiler_lab/neural_frame_replay_v53.py visuaml-client/backend/tests/test_neural_frame_replay_v53.py visuaml-client/backend/visuaml/compiler_lab/neural_frame_executor_v53.py visuaml-client/backend/tests/test_neural_frame_executor_v53.py
          PYTHONPATH=visuaml-client/backend python -m pytest -q visuaml-client/backend/tests/test_neural_frame_circuit_v53.py visuaml-client/backend/tests/test_neural_frame_replay_v53.py visuaml-client/backend/tests/test_neural_frame_executor_v53.py
