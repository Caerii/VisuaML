name: v15 final Ruff and certificate cleanup (one shot)
on:
  push:
    branches: [feat/compiler-ir-backends-assembly-spike]
    paths: ['.github/workflows/v15-quality-release.yml']
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'Caerii/VisuaML'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compiler-ir-backends-assembly-spike
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU testing and lint dependencies
        run: |
          python -m pip install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.1.3' 'pytest==8.3.4' 'ruff==0.17.4'
      - name: Apply only Ruff's safe fixes
        run: |
          ruff check --fix visuaml-client/backend/visuaml/compiler_lab/numpy_runtime.py visuaml-client/backend/visuaml/compiler_lab/stacked_decoder_v14.py visuaml-client/backend/tests/test_aot_performance_v15.py visuaml-client/backend/examples/compiler_perf_bench_v15.py
          ruff check visuaml-client/backend
      - name: Rebuild v13/v14 source-bound certificates
        working-directory: visuaml-client
        env:
          PYTHONPATH: backend
        run: |
          python backend/scripts/generate_decoder_certificate_v13.py
          python backend/scripts/generate_stacked_certificate_v14.py --output public/stacked_decoder_certificate.v14.json
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Format and check certificate JSON
        run: |
          pnpm --dir visuaml-client exec prettier --write public/decoder_compiler_certificate.v13.json public/stacked_decoder_certificate.v14.json
          pnpm --dir visuaml-client exec prettier --check .
      - name: Check numerical behavior and fingerprint gates
        working-directory: visuaml-client
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q backend/tests/test_aot_performance_v15.py backend/tests/test_decoder_certification_v13.py backend/tests/test_stacked_certification_v14.py
      - name: Commit narrow mechanical cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visuaml-client/backend/visuaml/compiler_lab/numpy_runtime.py visuaml-client/backend/visuaml/compiler_lab/stacked_decoder_v14.py visuaml-client/backend/tests/test_aot_performance_v15.py visuaml-client/backend/examples/compiler_perf_bench_v15.py visuaml-client/public/decoder_compiler_certificate.v13.json visuaml-client/public/stacked_decoder_certificate.v14.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(perf): apply safe Ruff fixes and refresh source certificates"
            git push origin HEAD:feat/compiler-ir-backends-assembly-spike
          fi
