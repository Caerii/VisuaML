<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/visuaml_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1419" />
    <title>VisuaML | Real-Time Collaborative PyTorch Model Visualization</title>
    <meta name="description" content="Visualize neural networks with category theory. Real-time collaborative PyTorch model visualization powered by categorical deep learning. Explore architectures, understand tensor flow, and collaborate with your team." />
    <meta name="keywords" content="neural networks, PyTorch, visualization, category theory, deep learning, collaborative, real-time, tensor visualization" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        overflow-y: auto;
        background: #0f1419;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        width: 100%;
        min-height: 100%;
        background: #0f1419;
      }

      @keyframes gradient {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(-45deg, #0f1419, #1a1f2e, #0f1419, #1a1f2e);
        background-size: 400% 400%;
        animation: gradient 15s ease infinite;
      }

      .loading img {
        height: 120px;
        filter: brightness(1.2) saturate(1.3);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.05);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <img src="/visuaml_logo.png" alt="VisuaML" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
